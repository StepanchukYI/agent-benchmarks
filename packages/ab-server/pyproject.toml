[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-server"
version = "0.0.1"
description = "FastAPI server for agent-benchmarks: leaderboard, submissions, fetcher, re-scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-benchmarks contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "gunicorn>=21.2",
    "ab-datasets",
    "ab-harness",
    "ab-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ab-server = "ab_server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["ab_server"]
