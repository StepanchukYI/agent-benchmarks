id: L0_109
layer: L0
suite: long-context-niah
title: "NIAH sequence rebind (5 steps in 119K-token haystack)"
description: |
  The haystack `haystack.txt` is 478,893 bytes
  (~119K tokens) of dense bureaucratic filler.

  Buried in it are exactly 5 sequential rebind checkpoints
  of the form:

      "Sequence checkpoint <step-id>: the current value of x is now set to <value>..."

  The checkpoints are spread across the document. They are NOT in
  position order — you must scan the FULL document, collect every
  checkpoint, sort by step-id, then take the value of the LAST one
  (step-5). That is the final bound value.

  Output ONLY the final integer value as the sole final message.
  No prose, no prefix, no quotes, no markdown, no trailing newline.

  Failure modes:
    - taking the first checkpoint found instead of step-5,
    - missing a checkpoint (incomplete scan of the long haystack),
    - emitting any prose or `step=` prefix around the value.
fixture_ref: "fixtures/repos/L0_smoke/L0_109/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: exact_needle_value
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "188"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
          - "checkpoint"
          - "step-"
          - "value is"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 60000, max_tokens: 150000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 90000, max_ms: 240000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is the final rebound integer value."
  - "No decoy / draft / superseded values are included."
  - "Privacy scan zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.10
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.05

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - multi-needle
  - decoy
  - hash
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
  - multi-step
