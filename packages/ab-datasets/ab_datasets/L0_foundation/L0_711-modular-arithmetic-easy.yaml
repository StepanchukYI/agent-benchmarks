id: L0_711
layer: L0
suite: reasoning-trap
title: "Modular arithmetic: clock-face hour (easy)"
description: |
  It is currently 09:00. Exactly 47 hours later, what hour does the
  clock show (24-hour format, two digits, no minutes, no AM/PM)?

  Compute: (9 + 47) mod 24 = 56 mod 24 = 8 → `08`.

  Output ONLY the two-digit hour `08` — no surrounding text, no quotes,
  no minutes, no trailing newline.

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_answer_check
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "08"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
