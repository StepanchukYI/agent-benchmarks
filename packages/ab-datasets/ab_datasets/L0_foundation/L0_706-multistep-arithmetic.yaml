id: L0_706
layer: L0
suite: reasoning-trap
title: "5-expression arithmetic chain with sha1 fingerprint"
description: |
  Evaluate the following FIVE expressions strictly in order. ALL
  divisions are INTEGER division (floor toward 0 on non-negative
  operands; same as Python `//`). `**` is exponentiation. `mod` is
  the Python `%` modulo. All operands are integers; all five results
  are integers.

      E1 = (17 * 23) - (45 / 5) + 8
      E2 = (13 ** 3) - (7 ** 4) + 1000
      E3 = ((100 - 37) * 4) + (256 / 8) - 11
      E4 = (11 ** 5) mod 997
      E5 = (2024 - 17) / 7 + (9 * 11) - 1

  Walk-through for E1:
      17 * 23 = 391
      45 / 5  = 9  (integer division)
      391 - 9 + 8 = 390   →  E1 = 390.

  Compute E1..E5. Join the five integers in order with the literal
  `:` (colon, U+003A) separator (no spaces):

      chain = "<E1>:<E2>:<E3>:<E4>:<E5>"

  Compute the lowercase hex SHA-1 of the UTF-8 bytes of `chain`
  (no trailing newline). Emit ONLY the 40-character hex digest as the
  final assistant message — no prefix, no quotes, no markdown, no
  working-out.

  Use `Bash` (`shasum -a 1`) or Python (`hashlib.sha1`). The digest is
  NOT given in this prompt — you must compute it.

  Failure modes:
    - using FLOAT division on E1 / E3 / E5 (yields `390.0` not `390`,
      which serialises differently inside the chain string),
    - off-by-one on any single E_i,
    - emitting the joined chain instead of the sha1,
    - prose around the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: arith_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "9bafc9eaa12328863effae38e238caf02d318939"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "390"
            - "796"
            - "step"
            - ":"
            - "E1"
            - "E2"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
