id: L0_706
layer: L0
suite: reasoning-trap
title: "Multi-step arithmetic with parentheses, negatives, fractions (BBH)"
description: |
  Compute the exact value of the following expression. All
  operations use standard math precedence (parentheses first, then
  multiplication/division left-to-right, then add/subtract
  left-to-right).

      ( -3 + 5 ) * ( 7 - 2 ) / 2 + ( 1/4 - 1/6 ) * 24

  Step-by-step:
    - (-3 + 5) = 2
    - (7 - 2) = 5
    - 2 * 5 = 10
    - 10 / 2 = 5
    - (1/4) - (1/6) = (3/12) - (2/12) = 1/12
    - (1/12) * 24 = 2
    - 5 + 2 = 7

  Answer: `7`.

  The user prompt:

    "Compute exactly. Output ONLY the integer or simplified fraction,
     no prose, no decimal approximation:

       ( -3 + 5 ) * ( 7 - 2 ) / 2 + ( 1/4 - 1/6 ) * 24"

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_number
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "7"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 0, pass_threshold: 1.0 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 500, max_tokens: 4000, pass_threshold: 0.5 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 10000, max_ms: 60000, pass_threshold: 0.5 }

acceptance_criteria:
  - "Final assistant message equals `7` exactly."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
