id: L0_013
layer: L0
suite: file-ops
title: "Deeply nested batch edit: bump version in every file under src/"
description: |
  The fixture has a deeply nested layout:

      src/api/v2/handlers/auth.py
      src/api/v2/handlers/users.py

  Each file starts with the line `# version: "0.1.0"`.

  The user asks:

    "In every `.py` file under `src/` (recurse), change the first
     line `# version: "0.1.0"` to `# version: "0.2.0"`. Every
     other line in every file must remain byte-for-byte identical.
     Do NOT add, remove, or rename files."

  Expected: both files have first line `# version: "0.2.0"` and
  unchanged body.

  Failure modes:
    - touching only one of the two files,
    - corrupting the body (e.g. reformatting),
    - changing files outside `src/`,
    - using regex that also matches `0.10.0` or other version
      strings (none present here, but probes discipline).

fixture_ref: "fixtures/repos/L0_smoke/L0_013/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: nested_batch_state
    kind: deterministic
    config:
      expected:
        src/api/v2/handlers/auth.py: "# version: \"0.2.0\"\ndef login():\n    return True\n"
        src/api/v2/handlers/users.py: "# version: \"0.2.0\"\ndef list_users():\n    return []\n"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 5, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 5000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 20000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Both files under src/ have first line `# version: \"0.2.0\"`."
  - "Bodies unchanged byte-for-byte."
  - "No files added or removed."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - batch-edit
  - nested
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
