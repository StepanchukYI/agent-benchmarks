id: L0_301
layer: L0
suite: tool-use
title: "Tool call with all required args present and correctly typed"
description: |
  The fixture exposes a single tool `create_user` whose required arguments
  are `email` (string, email format), `username` (non-empty string), and
  `age` (non-negative integer).

  The user prompt is:

    "Create a user with email alice@example.com, username alice, age 30."

  The agent MUST issue exactly one tool call to `create_user` with all
  three required arguments present and correctly typed (no extras, no
  string-vs-number swaps). Any tool call missing a required arg, or that
  uses a wrong type, or that fires extra calls, fails the task.

fixture_ref: "fixtures/repos/L0_smoke/L0_301/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: tool_call_validator
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "create_user"
          expected: 1
        - kind: tool_args_match_schema
          tool: "create_user"
        - kind: tool_args_equal
          tool: "create_user"
          expected:
            email: "alice@example.com"
            username: "alice"
            age: 30

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 5
      pass_threshold: 0.5

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 1000
      max_tokens: 8000
      pass_threshold: 0.4

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 15000
      max_ms: 90000
      pass_threshold: 0.4

acceptance_criteria:
  - "Exactly one call to `create_user` is issued."
  - "Arguments match the tool schema (email/username/age, no extras)."
  - "Argument values equal alice@example.com / alice / 30 (integer)."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bfcl
  - deterministic
  - smoke-test
