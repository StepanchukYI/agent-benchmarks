id: L0_301
layer: L0
suite: tool-use
title: "3-step state dialog: find max, derive hash, write summary"
description: |
  You have access to a bash shell. The fixture seeds `seed/users.json`
  with three user records (indented, with a trailing newline):

      [
        {"id": "U-001", "name": "Alia", "age": 32, "email": "alia@example.com"},
        {"id": "U-002", "name": "Boris", "age": 47, "email": "boris@example.com"},
        {"id": "U-003", "name": "Cyan", "age": 29, "email": "cyan@example.com"}
      ]

  Perform the THREE steps in order, leaving every intermediate file on
  disk:

    step 1 — Find the record with the maximum `age` and write it to
             `out/oldest.json` as a minified JSON object with EXACTLY
             these three keys in this order: `id`, `name`, `age`. No
             trailing newline. No surrounding prose.

    step 2 — Compute the SHA-256 hex digest (lowercase) of the
             oldest user's `name` value as a UTF-8 byte sequence (no
             newline appended) and write it to `out/name_hash.txt` —
             64 hex characters, no trailing newline.

    step 3 — Write `out/summary.json` containing exactly:
             {"oldest_id":"<id>","name_sha256":"<digest>","age":<age>}
             with the values pulled from steps 1 and 2. Keys in this
             order. No trailing newline.

  The agent must NOT fabricate or hard-code any value — both the
  oldest-record selection and the hash must derive from the seed file.

  Expected:
    out/oldest.json     = {"id":"U-002","name":"Boris","age":47}
    out/name_hash.txt   = 1eda6e8b94308b6c44e758e0a31d0950597ac53e274928a446a867d9e959117c
    out/summary.json    = {"oldest_id":"U-002","name_sha256":"1eda6e8b94308b6c44e758e0a31d0950597ac53e274928a446a867d9e959117c","age":47}

  Failure modes:
    - hard-coding "Boris" without reading the seed,
    - hashing the name + trailing newline (8 extra bytes),
    - wrong key order in the JSON objects,
    - missing any intermediate file.

fixture_ref: "fixtures/repos/L0_smoke/L0_301/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: three_step_state_chain
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/oldest.json"
          content: "{\"id\":\"U-002\",\"name\":\"Boris\",\"age\":47}"
        - kind: workdir_file_content_equals
          path: "out/name_hash.txt"
          content: "1eda6e8b94308b6c44e758e0a31d0950597ac53e274928a446a867d9e959117c"
        - kind: workdir_file_content_equals
          path: "out/summary.json"
          content: "{\"oldest_id\":\"U-002\",\"name_sha256\":\"1eda6e8b94308b6c44e758e0a31d0950597ac53e274928a446a867d9e959117c\",\"age\":47}"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 10, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2500, max_tokens: 8000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 30000, max_ms: 90000, pass_threshold: 0.6}

acceptance_criteria:
  - "All three intermediate files exist byte-exact."
  - "Hash derived from the actual seed value (no hard-coding)."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.20
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - multi-step
  - state-chain
  - derived-value
  - hard
  - byte-exact-output
  - output-normalization-sensitive
