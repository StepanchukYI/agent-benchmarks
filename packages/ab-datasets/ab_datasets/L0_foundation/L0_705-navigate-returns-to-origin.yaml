id: L0_705
layer: L0
suite: reasoning-trap
title: "Navigation: do these instructions return to the starting point? (BBH)"
description: |
  Imagine standing on an infinite 2D grid, facing NORTH at coordinates
  (0, 0). You execute the following instructions in order. Each
  forward step is one grid unit. Turns rotate your facing 90° but
  do not move you.

  Instructions:

      1. Walk forward 3 steps.
      2. Turn right.
      3. Walk forward 2 steps.
      4. Turn right.
      5. Walk forward 3 steps.
      6. Turn right.
      7. Walk forward 2 steps.

  Trace:
    - Start (0,0) facing N.
    - +3 N → (0, 3) facing N.
    - Turn right → facing E.
    - +2 E → (2, 3) facing E.
    - Turn right → facing S.
    - +3 S → (2, 0) facing S.
    - Turn right → facing W.
    - +2 W → (0, 0) facing W.

  Returns to (0,0). Answer is `True`.

  The user prompt:

    "Following those instructions exactly, do you end up at the
     starting point (0, 0)? Answer ONLY `True` or `False`,
     capitalised exactly, no prose."

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: exact_bool
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "True"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
