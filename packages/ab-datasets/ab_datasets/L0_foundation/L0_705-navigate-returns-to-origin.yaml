id: L0_705
layer: L0
suite: reasoning-trap
title: "5-path navigation chain: final (x,y) coordinates with sha1"
description: |
  Walk 5 independent paths on an integer grid. For each path: start at
  (0, 0) facing NORTH. Apply each step in order. After the last step
  record the final (x, y) coordinates.

  Step grammar (each step is one token from {L<n>, R<n>, F<n>} with
  integer n ≥ 1):
    - `L<n>` — turn LEFT by 90° × n. Position unchanged.
    - `R<n>` — turn RIGHT by 90° × n. Position unchanged.
    - `F<n>` — move FORWARD by n grid units in the current heading.
               Heading unchanged.

  Direction vectors: N=(0,+1), E=(+1,0), S=(0,-1), W=(-1,0).

  Path P1: F3 R1 F4 L1 F2
  Path P2: F5 R2 F5
  Path P3: R1 F7 L1 F7 L1 F7 L1 F7
  Path P4: F2 L1 F3 L1 F2 L1 F3
  Path P5: R3 F6 R1 F6

  After each path, format the coordinates as `<x>,<y>` (decimal,
  comma, no spaces; signed if negative).

  Chain = "<p1>;<p2>;<p3>;<p4>;<p5>" — semicolons between paths.

  Compute lowercase hex SHA-1 of the chain UTF-8 bytes. Emit ONLY the
  40-character digest. No prose, no markdown, no working-out.

  Failure modes:
    - confusing L/R rotation direction,
    - confusing R3 with R1 (R3 = turn right by 270° = same as L1),
    - forgetting that final F changes position but heading stays,
    - emitting the chain instead of the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: navigation_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "662f98669d2bd2b82f416af2e26fcaa0c772c142"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - ";"
            - "Path"
            - "origin"
            - "step"
            - "coordinates"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2500, max_tokens: 7000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 20000, max_ms: 65000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of the 5-path chain."
  - "All 5 paths simulated correctly."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

