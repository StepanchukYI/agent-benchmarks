  - name: latency_cost
    kind: deterministic
    config: {target_ms: 10000, max_ms: 30000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final assistant message equals `True` exactly."
  - "Privacy scan produces zero hits."

weights:
