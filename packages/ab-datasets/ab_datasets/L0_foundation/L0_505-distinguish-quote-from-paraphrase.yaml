id: L0_505
layer: L0
suite: faithfulness
title: "5-quote verbatim/paraphrase classification chain with sha1"
description: |
  ─── SOURCE TEXT ───
  Architect Iren Olbrich, when accepting the 2024 Bracken award, told
  the audience: "The form follows the water — every line of stone
  must learn from the river." Critics have noted that Olbrich's
  practice can be loosely summarised as a doctrine of fluidity over
  rigidity. In a 2023 interview, she remarked: "We do not draw
  buildings; we listen for them in the landscape." Her biographer
  Karel Vetz writes that Olbrich's work is "a kind of sympathetic
  geometry — buildings that lean toward their context." Olbrich
  herself denies any single doctrine; in 2025 she said: "I have no
  doctrine, only patience for the stone." Her early collaborators
  describe the studio's method as "iterative carving" — a phrase that
  Olbrich has neither endorsed nor disputed.
  ─── END SOURCE ───

  For each of the 5 quoted spans below, classify it as `V` (appears
  verbatim within `"..."` in the source) or `P` (paraphrase or
  third-party characterisation — not a verbatim Olbrich quote).

    Q1: "The form follows the water — every line of stone must learn
         from the river."
    Q2: "Olbrich believes form follows water."
    Q3: "Form follows water, every line of stone learning from the
         river."
    Q4: "I have no doctrine, only patience for the stone."
    Q5: "iterative carving"

  Walk-through:
    Q1: V — exact verbatim Olbrich quote.
    Q2: P — paraphrase.
    Q3: P — close but rephrased; not byte-identical.
    Q4: V — verbatim 2025 Olbrich quote.
    Q5: P — phrase used by collaborators, NOT Olbrich's own words.

  Chain = "<c1><c2><c3><c4><c5>" — five letters glued (each `V` or
  `P`). For this set the chain is `VPPVP`. Compute lowercase hex
  SHA-1 of the 5-char chain (UTF-8) and emit ONLY the 40-character
  digest.

  Failure modes:
    - mis-classifying a paraphrase as verbatim (Q2, Q3, Q5),
    - claiming Q5 is Olbrich's quote (source says collaborators said it),
    - emitting the chain instead of the sha1.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: verbatim_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "b565996709e300ae95bba28c48f724ea3c91ef81"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "VPPVP"
            - "Olbrich"
            - "verbatim"
            - "paraphrase"
            - "step"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 4, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2500, max_tokens: 7000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 20000, max_ms: 65000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `VPPVP`."
  - "All 5 verbatim/paraphrase classifications correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

