id: L0_401
layer: L0
suite: instruction-following
title: "IFBench-style 6 simultaneous verifiable constraints"
description: |
  The user prompt:

    "Write a paragraph about how photosynthesis works. ALL of the
     following must hold simultaneously — none of them is optional:

       1. Exactly 60 words (Unicode-word, \\w+).
       2. Exactly 4 sentences, separated by . ! ?.
       3. Must NOT contain (case-insensitive): chlorophyll, sunlight,
          carbon dioxide, oxygen, plant, green, leaf, energy.
       4. Must contain (case-sensitive, verbatim): the token 'ATP' once
          and the token 'Calvin' once.
       5. The first word must begin with the capital letter 'T'.
       6. No markdown — no triple backticks, no '**', no leading '# '
          or '- '."

  IFBench-style: 6 verifiable constraints applied simultaneously. The
  paper finds that frontier models drop 20–40 pp from "loose" (any
  single constraint satisfied) to "strict" (all simultaneous).

  Failure modes the scorer catches:
    - any forbidden substring present (case-insensitive),
    - missing ATP or Calvin,
    - wrong first letter,
    - word count off by 1,
    - sentence count off by 1,
    - markdown leaks.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: ifbench_six_constraint
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_word_count
          expected: 60
        - kind: final_assistant_message_sentence_count_range
          min: 4
          max: 4
        - kind: final_assistant_message_does_not_contain_ci
          forbidden:
            - chlorophyll
            - sunlight
            - carbon dioxide
            - oxygen
            - plant
            - green
            - leaf
            - energy
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "ATP"
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "Calvin"
        - kind: final_assistant_message_matches_any
          patterns:
            - "^T[a-z]"
        - kind: final_assistant_message_no_markdown

      pass_threshold: 0.7
  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 0
      pass_threshold: 1.0

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 600
      max_tokens: 2500
      pass_threshold: 0.6

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 10000
      max_ms: 30000
      pass_threshold: 0.6

acceptance_criteria:
  - "All 7 constraints simultaneously hold."
  - "Final message is plain prose only."
  - "Zero tool calls."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - instruction-following
  - ifbench
  - multi-constraint
  - deterministic
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
