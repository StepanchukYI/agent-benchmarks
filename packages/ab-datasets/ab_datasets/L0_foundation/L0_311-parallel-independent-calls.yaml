id: L0_311
layer: L0
suite: tool-use
title: "Parallel writes with slot-based path collision avoidance"
description: |
  You have access to a bash shell. The fixture seeds `seed/targets.json`
  with four target records:

      [
        {"slot": "a", "value": "alpha"},
        {"slot": "b", "value": "beta"},
        {"slot": "c", "value": "gamma"},
        {"slot": "d", "value": "delta"}
      ]

  The user asks:

    "For each target, write the `value` to a separate file at the path
     `out/slot_<slot>.txt` (e.g. `out/slot_a.txt` contains `alpha`).
     ALL four files must exist; each contains the exact `value` string
     for its slot, with NO trailing newline.

     IMPORTANT: a naive implementation that writes all values to a
     single `out/slot.txt` (collapsing the slot field) would only
     leave the last write visible. Your tool calls must use the
     `slot` value to derive a DISTINCT output path per record — no
     output-key collision."

  Expected files (4 total):
    out/slot_a.txt  = `alpha` (5 bytes, no LF)
    out/slot_b.txt  = `beta`  (4 bytes, no LF)
    out/slot_c.txt  = `gamma` (5 bytes, no LF)
    out/slot_d.txt  = `delta` (5 bytes, no LF)

  Failure modes:
    - writing all four values to `out/slot.txt` (final state = "delta"),
    - writing only the first or last target,
    - swapping slot ↔ value (writing "alpha" → out/slot_alpha.txt),
    - emitting trailing newlines.

fixture_ref: "fixtures/repos/L0_smoke/L0_311/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: per_slot_writes
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/slot_a.txt"
          content: "alpha"
        - kind: workdir_file_content_equals
          path: "out/slot_b.txt"
          content: "beta"
        - kind: workdir_file_content_equals
          path: "out/slot_c.txt"
          content: "gamma"
        - kind: workdir_file_content_equals
          path: "out/slot_d.txt"
          content: "delta"
        - kind: workdir_file_absent
          path: "out/slot.txt"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 10, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2500, max_tokens: 7000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 22000, max_ms: 70000, pass_threshold: 0.6}

acceptance_criteria:
  - "All four slot files present with exact bytes."
  - "No `out/slot.txt` collision file."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.20
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - parallel-writes
  - path-collision
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
