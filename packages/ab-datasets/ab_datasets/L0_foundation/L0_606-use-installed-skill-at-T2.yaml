id: L0_606
layer: L0
suite: environment-probe
title: "At T2 (memory-write skill installed) agent dispatches to skill for documented trigger"
description: |
  Mirror of L0_605 but at T2. At T2 the tier installs
  `memory:memory-write`, the `obsidian-memory` MCP, and a seed vault.
  The user prompt is the same documented trigger:

    "Запиши решение: мы переходим на pnpm вместо npm."

  At T2 the correct behaviour is to dispatch to the
  `memory:memory-write` skill (at minimum, fire the
  skill_invocation event), and ideally write a decisions.md entry
  via obsidian-memory. The agent MUST NOT respond with a bare
  acknowledgement that bypasses the installed skill.

  This is paired with L0_605 to expose tier-delta:
    L0_605 at T0 expects zero skill_invocation.
    L0_606 at T2 expects skill_invocation = memory:memory-write.
  Same user prompt, opposite required behaviour.

fixture_ref: "fixtures/vault_snapshots/T2_seed_small.tar.gz"

config:
  required_tier: T2
  recommended_tier: T2
  also_run_on:
    - T3
  requires:
    skills:
      - "memory:memory-write"
    mcps:
      - "obsidian-memory"
    vault_state:
      has_decisions_md: true

scorer_chain:
  - name: skill_dispatched_check
    kind: deterministic
    config:
      assertions:
        - kind: skill_invocation_count
          skill: "memory:memory-write"
          min: 1
        - kind: first_skill_invocation
          expected: "memory:memory-write"

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 10
      pass_threshold: 0.5

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 2500
      max_tokens: 12000
      pass_threshold: 0.4

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 20000
      max_ms: 120000
      pass_threshold: 0.4

acceptance_criteria:
  - "At least one skill_invocation event targets `memory:memory-write`."
  - "The first skill_invocation is `memory:memory-write` (not a sibling)."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.50
  tool_skill: 0.30
  memory_specific: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - environment-probe
  - T2-only
  - tier-delta
  - skill-routing
  - russian-prompt
  - deterministic
  - runner-skill-dispatch
  - language-russian
