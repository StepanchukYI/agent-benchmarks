id: L0_407
layer: L0
suite: instruction-following
title: "Forbidden + mandatory + length 3-axis IFBench-extended"
description: |
  The user prompt:

    "Write a single paragraph about how a rainbow forms. ALL of the
     following constraints hold simultaneously:

       1. EXACTLY 80 words (Unicode \\w+ tokens). Not 79, not 81.
       2. EXACTLY 5 sentences (separated by . ! ?).
       3. Must NOT contain any of these substrings (case-insensitive):
          prism, Newton, colour, color, spectrum, wavelength, nm,
          Iris, sun shower, God, pot of gold, rainbow, light.
       4. MUST contain EACH of these substrings (case-sensitive
          verbatim): 'Snell', 'refractive index', 'cone of view',
          'circular arc'.
       5. First word must start with the capital letter 'W'.
       6. Last word must start with the lowercase letter 'r'.
       7. No markdown — no triple backticks, no '**', no leading
          '# ' or '- '.

     Plain prose only. No quotes around the paragraph. No lists.
     No commentary before or after."

  Frontier hardness: the forbidden list eliminates 13 of the most
  natural words to use; the mandatory list forces 4 specific
  technical phrases; the length and sentence count are exact; first/
  last letter constraints further restrict word choice.

  Failure modes:
    - any forbidden substring (case-insensitive),
    - any mandatory substring missing,
    - 79 or 81 words (off-by-one common),
    - 4 or 6 sentences,
    - first word not starting with 'W',
    - last word not starting with lowercase 'r'.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: seven_axis_constraint
    kind: deterministic
    config:
      pass_threshold: 0.71
      assertions:
        - kind: final_assistant_message_word_count
          expected: 80
        - kind: final_assistant_message_sentence_count_range
          min: 5
          max: 5
        - kind: final_assistant_message_does_not_contain_ci
          forbidden:
            - prism
            - Newton
            - colour
            - color
            - spectrum
            - wavelength
            - " nm "
            - Iris
            - sun shower
            - " God "
            - pot of gold
            - rainbow
            - light
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "Snell"
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "refractive index"
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "cone of view"
        - kind: final_assistant_message_contains_substring_verbatim
          substring: "circular arc"
        - kind: final_assistant_message_matches_any
          patterns:
            - "^W[a-z]"
        - kind: final_assistant_message_matches_any
          patterns:
            - "\\br[a-z]+[.!?]?\\s*$"
        - kind: final_assistant_message_no_markdown

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 0, pass_threshold: 1.0}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 700, max_tokens: 3000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 12000, max_ms: 40000, pass_threshold: 0.6}

acceptance_criteria:
  - "7 of 10 constraints simultaneously satisfied (graded threshold 0.71)."
  - "Strict on word count, sentence count, forbidden + mandatory."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - instruction-following
  - ifbench
  - multi-constraint
  - negative
  - mandatory
  - hard
  - reasoning-sensitive
