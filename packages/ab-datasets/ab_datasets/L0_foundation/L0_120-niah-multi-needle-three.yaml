id: L0_120
layer: L0
suite: long-context-niah
title: "Multi-needle NIAH: three ledger codes at random depths"
description: |
  The fixture provides `haystack.txt` (~21 KB, 50 paragraphs) with
  three planted facts at random depths:

      "The Cantillon ledger code is L-3361."
      "The Drystone  ledger code is L-7029."
      "The Westgate  ledger code is L-1488."

  The user asks:

      "From the haystack: list the ledger code for every place that
       HAS one. Use exact strings. Output one pair per line in the
       form `<place>=<code>`, alphabetical by place. No prose, no
       trailing newline."

  Expected final assistant message (exact, 3 lines):

      Cantillon=L-3361
      Drystone=L-7029
      Westgate=L-1488

  Failure modes:
    - missing any pair,
    - wrong association (place ↔ code mismatch),
    - extra rows for places that DON'T have a ledger code,
    - format drift (spaces, prose, trailing newline).

fixture_ref: "fixtures/repos/L0_smoke/L0_120/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_multi_key_check
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "Cantillon=L-3361\nDrystone=L-7029\nWestgate=L-1488"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 3, pass_threshold: 0.7 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 8000, max_tokens: 32000, pass_threshold: 0.3 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 30000, max_ms: 180000, pass_threshold: 0.3 }

acceptance_criteria:
  - "Final assistant message equals the three lines `<place>=<code>` exactly."
  - "Pairs are alphabetical by place."
  - "Every association is correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - multi-needle
  - ruler
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
