id: L0_501
layer: L0
suite: faithfulness
title: "5-question abstain chain with sha1 fingerprint"
description: |
  Below is the SOURCE text (Acme Widget Co. Q2 2025 quarterly report).
  After it are 5 questions. For each question, classify whether the
  source contains enough information to answer (output `0`) or NOT
  (output `1` = abstain). Then chain the 5 binary digits and sha1 it.

  ─── SOURCE ───
  Acme Widget Co. — Q2 2025 quarterly report.
  Revenue by product line:
    Sprockets: $42.0M, up 8% YoY.
    Gizmos:    $31.5M, up 12% YoY.
    Widgets:   $18.2M, flat YoY.
  Total Q2 revenue: $91.7M.
  Gross margin: 56.4% on the consolidated business.
  Churn rate, customer-acquisition cost, and net revenue retention
  are reported quarterly on the consolidated basis only.
  Headcount at end of Q2: 412.
  Cash balance at end of Q2: $215M.
  Capex Q2: $8.3M, primarily in machinery upgrades at the Akron plant.
  ─── END SOURCE ───

  Questions (answer each as 0 = answerable, 1 = abstain):
    Q1: "What was Acme's total Q2 2025 revenue?"
    Q2: "What was Acme's Sprockets churn rate in Q2 2025?"
    Q3: "Was Acme's Q2 2025 gross margin above 50%?"
    Q4: "What is Acme's stock ticker symbol?"
    Q5: "Did Acme's Gizmos line grow faster YoY than Sprockets in Q2?"

  Walk-through:
    Q1: 0 (source says $91.7M).
    Q2: 1 (churn reported on consolidated basis only, not per-line).
    Q3: 0 (source says 56.4%; 56.4 > 50 → yes).
    Q4: 1 (ticker not mentioned anywhere).
    Q5: 0 (Sprockets 8%, Gizmos 12%; 12 > 8 → yes).

  Chain = "<a1><a2><a3><a4><a5>" — five digits glued (each 0 or 1).
  For this set the chain is `01011`. Compute lowercase hex SHA-1 of
  the 5-char chain (UTF-8) and emit ONLY the 40-character digest.

  Failure modes:
    - over-extracting (claiming Q2 is answerable from consolidated data),
    - under-extracting (claiming Q5 is unanswerable),
    - emitting the chain instead of the sha1,
    - hallucinating a ticker for Q4.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: abstain_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "423954bfe8bae9f4faa66eda54301e9aebff4c9a"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "01011"
            - "Q1"
            - "answer"
            - "abstain"
            - "step"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 4, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `01011`."
  - "All 5 abstain classifications correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - faithfulness
  - abstain
  - multi-step
  - sha1-fingerprint
  - hard
  - reasoning-sensitive
