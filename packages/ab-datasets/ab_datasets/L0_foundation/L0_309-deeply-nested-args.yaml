id: L0_309
layer: L0
suite: tool-use
title: "Tool call with deeply nested object args (3 levels)"
description: |
  The fixture exposes `create_subscription(user, plan)` where `user`
  is a nested object: `{id, contact: {email, address: {country,
  city}}}`. Three levels deep.

  The user prompt:

    "Subscribe user `u-7421` (email alice@example.com, country DE,
     city Berlin) to the `pro` plan."

  The agent MUST issue exactly one call to `create_subscription`
  with the EXACT nested structure (no flattening, no extra fields,
  schema-valid).

  Expected args:

      {
        "user": {
          "id": "u-7421",
          "contact": {
            "email": "alice@example.com",
            "address": { "country": "DE", "city": "Berlin" }
          }
        },
        "plan": "pro"
      }

  Failure modes:
    - flattening to `user_id`, `user_email`, etc.,
    - extra fields (additionalProperties: false),
    - `country=Germany` instead of `DE`,
    - wrong plan enum value.

fixture_ref: "fixtures/repos/L0_smoke/L0_309/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: nested_args_validator
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "create_subscription"
          expected: 1
        - kind: tool_args_match_schema
          tool: "create_subscription"
        - kind: tool_args_equal
          tool: "create_subscription"
          expected:
            user:
              id: "u-7421"
              contact:
                email: "alice@example.com"
                address: { country: "DE", city: "Berlin" }
            plan: "pro"

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 3, pass_threshold: 0.7 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 1500, max_tokens: 10000, pass_threshold: 0.4 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 18000, max_ms: 120000, pass_threshold: 0.4 }

acceptance_criteria:
  - "Exactly one call to `create_subscription` is issued."
  - "Args match the nested schema exactly."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bfcl
  - deeply-nested
  - frontier
  - deterministic
  - reasoning-sensitive
