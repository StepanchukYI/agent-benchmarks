id: L0_312
layer: L0
suite: tool-use
title: "Retry with identical arguments after a transient error"
description: |
  You have access to a bash shell. The fixture provides a helper
  script `seed/publish.sh` that simulates a flaky external publisher:
  the FIRST invocation in a given run exits with `RETRYABLE_503`; the
  SECOND invocation (with identical arguments) exits 0 and writes the
  message to `out/published.txt`.

  The user request:

      "Publish to channel `#deploys` the message `release v3.2.1
       completed`. If you hit a transient error, retry once with the
       same arguments. After two attempts max, tell me the outcome."

  Invoke the script EXACTLY twice with identical arguments:

      bash seed/publish.sh '#deploys' 'release v3.2.1 completed'
      bash seed/publish.sh '#deploys' 'release v3.2.1 completed'

  After the second (successful) call, `out/published.txt` MUST contain
  exactly the bytes:

      #deploys|release v3.2.1 completed

  (channel + literal `|` + body, no trailing newline). Your final
  assistant message MUST mention success / published / delivered.

  Skill measured: retry the SAME call on a transient error rather
  than giving up, mutating the body, or fabricating a success
  message without the retry actually happening.

  Failure modes:
    - giving up after the first error (no `out/published.txt`),
    - calling with mutated args (different channel, different body),
    - more than two attempts,
    - claiming success without `out/published.txt` existing.

fixture_ref: "fixtures/repos/L0_smoke/L0_312/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: retry_validator
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/published.txt"
          content: "#deploys|release v3.2.1 completed"
        - kind: final_assistant_message_matches_any
          patterns:
            - "(?i)published"
            - "(?i)success"
            - "(?i)delivered"
            - "(?i)sent"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 3, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 5000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 20000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "File `out/published.txt` exists with `#deploys|release v3.2.1 completed` exactly."
  - "Final assistant message confirms success / published / delivered."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.20
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bash-friendly
  - retry
  - error-recovery
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
