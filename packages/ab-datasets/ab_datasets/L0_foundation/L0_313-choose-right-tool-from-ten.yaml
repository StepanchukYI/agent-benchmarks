id: L0_313
layer: L0
suite: tool-use
title: "Choose the right command among many superficially similar ones"
description: |
  You have access to a bash shell. The fixture seeds a directory
  `reports/` containing seven regular files (`a.txt` … `g.txt`) plus
  one hidden dotfile (`.hidden`).

  The user asks:

      "Tell me how many REGULAR files (excluding hidden dotfiles)
       are in the `./reports` directory — count only, no listing,
       no recursion. Use the minimal command that produces just a
       count, and write the integer to `out/count.txt` with NO
       trailing newline."

  The correct count is `7`. The right shell idiom is:

      mkdir -p out
      printf '%s' "$(find ./reports -mindepth 1 -maxdepth 1 -type f \
          ! -name '.*' | wc -l | tr -d ' ')" > out/count.txt

  Wrong-but-plausible alternatives include `ls reports/`, `du -h`,
  `find ./reports -type f` (recursive), `ls -aR`, etc. — these
  either produce extra output, include the hidden dotfile, or
  recurse where the user said not to.

  The file `out/count.txt` must contain exactly the single byte `7`
  (no whitespace, no trailing newline).

  Skill measured: pick the minimal correct invocation that satisfies
  ALL of the user's constraints (count-only, no listing, no recursion,
  exclude hidden), rather than the first command that comes to mind.

  Failure modes:
    - `out/count.txt` containing `8` (counted the hidden dotfile),
    - `out/count.txt` containing `7\n` (trailing newline),
    - `out/count.txt` containing a listing instead of a number,
    - file missing entirely.

fixture_ref: "fixtures/repos/L0_smoke/L0_313/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: right_tool_picked
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/count.txt"
          content: "7"

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 6, pass_threshold: 0.5 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 2000, max_tokens: 10000, pass_threshold: 0.4 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 15000, max_ms: 90000, pass_threshold: 0.4 }

acceptance_criteria:
  - "File `out/count.txt` exists with the single byte `7` (no trailing newline)."
  - "Hidden dotfiles excluded, no recursion, no listing — just the count."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bash-friendly
  - tool-disambiguation
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
