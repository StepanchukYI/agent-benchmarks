id: L0_313
layer: L0
suite: tool-use
title: "Choose the right tool from 10 confusingly similar tools"
description: |
  The fixture exposes 10 filesystem-shaped tools whose NAMES are
  intentionally similar: `list_files`, `list_files_recursive`,
  `list_directories`, `list_hidden`, `find_files`, `stat_path`,
  `read_file`, `tree`, `disk_usage`, `count_files`.

  The user asks:

    "Show me how many regular files (excluding hidden dotfiles)
     are in the `./reports` directory — count only, no listing,
     no recursion."

  The right tool is `count_files(path="./reports")`. Wrong but
  plausible picks:
    - `list_files` — returns names, not a count,
    - `list_files_recursive` — wrong scope (recursion),
    - `list_hidden` — wrong sign,
    - `find_files` — wrong abstraction,
    - `tree` — wrong format.

  The agent MUST issue exactly one call to `count_files` with
  `path="./reports"`.

fixture_ref: "fixtures/repos/L0_smoke/L0_313/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: right_tool_picked
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "count_files"
          expected: 1
        - kind: tool_args_equal
          tool: "count_files"
          expected: { path: "./reports" }
        - kind: tool_call_count
          tool: "list_files"
          expected: 0
        - kind: tool_call_count
          tool: "list_files_recursive"
          expected: 0
        - kind: tool_call_count
          tool: "list_hidden"
          expected: 0
        - kind: tool_call_count
          tool: "find_files"
          expected: 0
        - kind: tool_call_count
          tool: "tree"
          expected: 0
        - kind: tool_call_count
          tool: "disk_usage"
          expected: 0

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 3, pass_threshold: 0.7 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 1500, max_tokens: 10000, pass_threshold: 0.4 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 15000, max_ms: 90000, pass_threshold: 0.4 }

acceptance_criteria:
  - "Exactly one call to `count_files` with `path=./reports`."
  - "Zero calls to any of the nine confusable alternatives."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bfcl
  - tool-disambiguation
  - frontier
  - deterministic
  - reasoning-sensitive
