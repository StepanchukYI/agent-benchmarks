id: L0_712
layer: L0
suite: reasoning-trap
title: "Set difference: list elements in A but not in B (easy)"
description: |
  Given two sets of integers:

      A = {2, 3, 5, 7, 11, 13, 17, 19}
      B = {1, 3, 5, 7, 9, 11, 13}

  Compute A \ B (the elements of A that are NOT in B). Output ONLY
  the resulting elements as a comma-separated list, ascending order,
  no spaces, no surrounding brackets, no trailing newline.

  A \ B = {2, 17, 19} → output `2,17,19`.

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_answer_check
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "2,17,19"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 2, pass_threshold: 1.0 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 400, max_tokens: 3000, pass_threshold: 0.5 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 8000, max_ms: 60000, pass_threshold: 0.5 }

acceptance_criteria:
  - "Final assistant message equals `2,17,19` exactly."
  - "Comma-separated, no spaces, ascending order."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - reasoning-trap
  - set-theory
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
