id: L0_308
layer: L0
suite: tool-use
title: "Tool call with enum-valued arg: pick a valid value, never invent one"
description: |
  The fixture exposes `set_priority(issue_id, priority)` where
  `priority` is constrained to `low | medium | high | critical`.

  The user prompt deliberately uses a synonym not in the enum:

    "Mark issue JIRA-42 as urgent."

  The agent MUST map the user's intent to a valid enum value
  (`high` or `critical` are both defensible; `urgent` is NOT in
  the enum and MUST NOT be sent). Exactly one tool call with
  `issue_id="JIRA-42"` and `priority` ∈ {`high`, `critical`}.

  Failure modes:
    - sending `priority="urgent"` (schema-invalid),
    - sending `priority="medium"` or `"low"` (wrong magnitude),
    - sending an empty/missing `priority`,
    - asking the user "what enum value should I use" when the
      mapping is unambiguous.

fixture_ref: "fixtures/repos/L0_smoke/L0_308/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: tool_call_validator
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "set_priority"
          expected: 1
        - kind: tool_args_match_schema
          tool: "set_priority"
        - kind: tool_arg_equal
          tool: "set_priority"
          arg: "issue_id"
          expected: "JIRA-42"
        - kind: tool_arg_in_set
          tool: "set_priority"
          arg: "priority"
          allowed: ["high", "critical"]

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 3
      pass_threshold: 0.6

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 1000
      max_tokens: 8000
      pass_threshold: 0.4

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 12000
      max_ms: 60000
      pass_threshold: 0.5

acceptance_criteria:
  - "Exactly one call to `set_priority` is issued."
  - "Argument `priority` is one of {`high`, `critical`}."
  - "Argument `priority` is NEVER `urgent` (schema-invalid)."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bfcl
  - enum-validation
  - intent-mapping
  - deterministic
  - smoke-test
  - reasoning-sensitive
