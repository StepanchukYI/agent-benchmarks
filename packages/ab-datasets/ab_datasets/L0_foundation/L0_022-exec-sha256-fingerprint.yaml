id: L0_022
layer: L0
suite: exec
title: "SHA-256 of a byte range selected by a separate prior step"
description: |
  The fixture provides `data.bin` (256 deterministic random bytes; seed
  20260524). The agent must compute the SHA-256 hex digest of a
  **range** of bytes, not the whole file.

  The user asks:

    "In two steps:

       step 1 — extract bytes [64, 128) from `data.bin` (64 bytes
                starting at offset 64) into a new file
                `out/range.bin`. Use `dd`, `tail -c | head -c`, or
                `head -c128 | tail -c64`. Do NOT use Python.
       step 2 — compute SHA-256 of `out/range.bin` and write ONLY
                the 64-hex-character lowercase digest to
                `out/digest.txt` (no trailing newline, no filename
                column, no `sha256:` prefix).

     Both files must exist at the end of the run."

  Expected:

      out/range.bin   exactly 64 bytes, matching data.bin[64:128]
      out/digest.txt  exact 64-char hex digest:
                      `86c50668a6f0ed0d0972fee79adbe41c0e16bbac5e46117afea845b203da3ccf`

  Failure modes:
    - off-by-one on the byte range (extracting [63,127) or [64,127]),
    - hashing the whole `data.bin` instead of the range (Opus's most
      likely shortcut — must resist),
    - using Python (forbidden — shell only),
    - including the filename column in the digest file,
    - uppercase hex,
    - trailing newline in the digest file.

fixture_ref: "fixtures/repos/L0_smoke/L0_022/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: range_then_hash
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/digest.txt"
          content: "86c50668a6f0ed0d0972fee79adbe41c0e16bbac5e46117afea845b203da3ccf"
        - kind: workdir_file_exists
          path: "out/range.bin"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 6, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 1500, max_tokens: 5000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "out/range.bin exists (64 bytes, bytes [64,128) of data.bin)."
  - "out/digest.txt = lowercase 64-hex SHA-256 of that range, no newline."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - exec
  - bash
  - hashing
  - sha256
  - multi-step
  - hard
  - byte-exact-output
  - output-normalization-sensitive
