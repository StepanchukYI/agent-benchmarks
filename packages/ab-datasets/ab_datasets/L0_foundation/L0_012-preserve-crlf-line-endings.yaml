id: L0_012
layer: L0
suite: file-ops
title: "Edit a CRLF-line-ended file preserving line endings"
description: |
  The fixture `notes.txt` contains four lines, each terminated by
  CRLF (`\r\n`). Total file content is:

      "line one\r\nline two\r\nline three\r\nline four\r\n"

  The user asks:

    "In notes.txt, replace `line two` with `line TWO` (uppercase TWO,
     space preserved). Do NOT change anything else: every other
     line must be byte-for-byte identical, and ALL line endings
     must remain CRLF (`\r\n`). Do not switch to LF endings."

  Expected final content (exact bytes):

      "line one\r\nline TWO\r\nline three\r\nline four\r\n"

  Failure modes:
    - converting CRLF → LF (Unix tooling does this silently),
    - dropping the trailing CRLF,
    - changing capitalization of an unrelated word.

fixture_ref: "fixtures/repos/L0_smoke/L0_012/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: crlf_preserved_diff
    kind: deterministic
    config:
      expected:
        notes.txt: "line one\r\nline TWO\r\nline three\r\nline four\r\n"
      encoding: "utf-8"
      forbid_lf_only: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 5, pass_threshold: 0.6 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 1500, max_tokens: 8000, pass_threshold: 0.5 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 15000, max_ms: 90000, pass_threshold: 0.5 }

acceptance_criteria:
  - "notes.txt has the exact byte content with CRLF line endings."
  - "Only `line two` was changed to `line TWO`; other lines unchanged."
  - "No LF-only line endings introduced."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - line-endings
  - crlf
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
