id: L0_005
layer: L0
suite: extract
title: "Summarize a source file into a 3-line README"
description: |
  The fixture provides `source.py` containing three public top-level
  functions — `alpha`, `beta`, `gamma` — and one private helper `_private`
  (whose name starts with `_`).

  The agent must create `README.md` containing exactly three bullet-point
  lines, one per public function, in this exact order and exact format:

      - alpha
      - beta
      - gamma

  Trailing newline after the last line. No additional content, no headers,
  no whitespace beyond what's shown. The private helper `_private` MUST
  NOT appear anywhere in the file.

fixture_ref: "fixtures/repos/L0_smoke/L0_005/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: readme_exact
    kind: deterministic
    config:
      expected:
        README.md: "- alpha\n- beta\n- gamma\n"

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 30
      pass_threshold: 0.5

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 2000
      max_tokens: 20000
      pass_threshold: 0.3

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 30000
      max_ms: 180000
      pass_threshold: 0.3

acceptance_criteria:
  - "`README.md` exists at the sandbox working directory after the run."
  - "Content equals exactly `- alpha\\n- beta\\n- gamma\\n` (three bullet lines in that order, trailing newline)."
  - "Privacy scan produces zero hits against docs/privacy-patterns.yaml."

weights:
  correctness: 0.70
  tool_skill: 0.15
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - extract
  - readme
  - deterministic
  - smoke-test
