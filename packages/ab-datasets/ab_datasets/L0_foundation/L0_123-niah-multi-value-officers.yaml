id: L0_123
layer: L0
suite: long-context-niah
title: "NIAH hardened: 6 needles + decoys + sha1 pipeline (119K tokens)"
description: |
  The haystack `haystack.txt` is 478,326 bytes
  (~119K tokens) of dense bureaucratic filler.

  STEP 1 — Extract.
    Read haystack.txt. Find every paragraph that contains the phrase
    "deputy commander" used as a FACTUAL statement (look for the
    confirmed-by-regional-verification-panel phrasing, NOT draft /
    preliminary / superseded entries — those are decoys to exclude).

    There are exactly 6 TRUE (entity, value) pairs to
    collect. Each entity appears in exactly ONE confirmed paragraph;
    some entities ALSO appear in a DECOY paragraph (marked "draft"
    or "preliminary, superseded") — those must be EXCLUDED.

    Entity names you must find values for (values are NOT given —
    discover each entity's <value> from the haystack itself):
      Storra, Tornmoor, Underholt, Vyport, Westcairn, Xenmore

  STEP 2 — Sort.
    Sort the (entity, value) pairs alphabetically by entity name.

  STEP 3 — Format.
    Build a SINGLE string by joining the pairs as `<entity>=<value>`
    with the literal `|` separator (NO whitespace around `|`).
    The `<value>` is exactly as printed in the haystack INCLUDING
    any unit suffix (e.g. `88.7 MHz`, not just `88.7`).

  STEP 4 — Hash.
    Compute the lowercase hex SHA-1 of the UTF-8 bytes of the joined
    string (no trailing newline). Emit ONLY the 40-character hex
    digest as the final assistant message. No prefix, no quotes, no
    markdown, no trailing newline.

    You must actually compute the hash — the digest is NOT in this
    description. Use `Bash` (`shasum -a 1` or `sha1sum`) or Python
    (`hashlib.sha1(s.encode()).hexdigest()`).

  Failure modes:
    - including a decoy value (draft/superseded entry),
    - missing a needle (especially the tail-depth ones),
    - emitting the joined string instead of the sha1,
    - wrong sort order (must be alphabetical by entity name),
    - emitting prose surrounding the digest.
fixture_ref: "fixtures/repos/L0_smoke/L0_123/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: four_needles_ordered
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "bdba0f1be8716f3b2558ab686d4bec1ce5464a7d"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
          - "Storra"
          - "deputy"
          - "="

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 60000, max_tokens: 150000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 90000, max_ms: 240000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is the 40-char lowercase hex sha1 of the pipe-joined alphabetical pairs."
  - "No decoy / draft / superseded values are included."
  - "Privacy scan zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.10
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.05

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - multi-needle
  - decoy
  - hash
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
  - multi-step
