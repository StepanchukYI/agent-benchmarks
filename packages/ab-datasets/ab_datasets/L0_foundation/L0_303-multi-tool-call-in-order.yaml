id: L0_303
layer: L0
suite: tool-use
title: "Strict-order state transitions with plausible distractor files"
description: |
  You have access to a bash shell. The fixture seeds:

      seed/stage.txt                 = "init\n"     (the live stage file)
      decoy/stage_other.txt          = "untouched\n"  (distractor — DO NOT TOUCH)
      decoy/stage.txt.bak            = "untouched\n"  (distractor — DO NOT TOUCH)

  Perform the three state transitions in STRICT order, leaving every
  intermediate persisted to a separate file:

    step 1 — Read `seed/stage.txt`. Write `out/stage_1.txt` containing
             exactly the single word `build` (no trailing newline).
    step 2 — Read `out/stage_1.txt`. Write `out/stage_2.txt`
             containing exactly the single word `test` (no trailing
             newline).
    step 3 — Read `out/stage_2.txt`. Write `out/stage_3.txt`
             containing exactly the single word `ship` (no trailing
             newline).

  Additional rules:
    - The two decoy files in `decoy/` MUST remain byte-identical to
      their seeded content (`untouched\n`). If the agent globs `**/*`
      and rewrites files indiscriminately, those decoys will be hit.

  Expected final state:
    out/stage_1.txt  = `build` (5 bytes, no LF)
    out/stage_2.txt  = `test` (4 bytes, no LF)
    out/stage_3.txt  = `ship` (4 bytes, no LF)
    decoy/stage_other.txt  unchanged from fixture
    decoy/stage.txt.bak    unchanged from fixture

  Failure modes:
    - touching the decoy files (clobbered by a too-wide glob),
    - skipping intermediates (writing only stage_3.txt),
    - adding trailing newlines,
    - rewriting `seed/stage.txt` in place rather than producing
      stage_N.txt outputs.

fixture_ref: "fixtures/repos/L0_smoke/L0_303/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: strict_order_with_decoys
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/stage_1.txt"
          content: "build"
        - kind: workdir_file_content_equals
          path: "out/stage_2.txt"
          content: "test"
        - kind: workdir_file_content_equals
          path: "out/stage_3.txt"
          content: "ship"
        - kind: file_unchanged
          path: "decoy/stage_other.txt"
        - kind: file_unchanged
          path: "decoy/stage.txt.bak"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 25000, max_ms: 75000, pass_threshold: 0.6}

acceptance_criteria:
  - "Three stage files written byte-exact in `out/`."
  - "Two decoy files unchanged from fixture."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.20
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - strict-order
  - distractor
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
