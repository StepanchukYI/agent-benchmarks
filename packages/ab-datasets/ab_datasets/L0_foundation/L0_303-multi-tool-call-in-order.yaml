id: L0_303
layer: L0
suite: tool-use
title: "Multi-tool call in correct order (create_order then send_confirmation_email)"
description: |
  The fixture exposes two tools: `create_order(customer_id, items) -> order_id`
  and `send_confirmation_email(order_id)`. The second tool's `order_id`
  must be the value returned by the first.

  The user prompt is:

    "Place an order for customer C-42 containing items SKU-1 and SKU-2,
     and send the confirmation email."

  The agent MUST issue exactly two tool calls, in this order:
    1. `create_order(customer_id="C-42", items=["SKU-1", "SKU-2"])`
    2. `send_confirmation_email(order_id=<returned order_id>)`
  passing the returned order_id verbatim. Reversed order, missing the
  second call, or fabricating an order_id (not from the tool return)
  fails the task.

fixture_ref: "fixtures/repos/L0_smoke/L0_303/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: tool_call_validator
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "create_order"
          expected: 1
        - kind: tool_call_count
          tool: "send_confirmation_email"
          expected: 1
        - kind: tool_call_order
          order:
            - "create_order"
            - "send_confirmation_email"
        - kind: tool_args_equal
          tool: "create_order"
          expected:
            customer_id: "C-42"
            items: ["SKU-1", "SKU-2"]
        - kind: tool_arg_from_prior_return
          tool: "send_confirmation_email"
          arg: "order_id"
          source_tool: "create_order"
          source_field: "order_id"

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 6
      pass_threshold: 0.5

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 1500
      max_tokens: 10000
      pass_threshold: 0.4

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 20000
      max_ms: 120000
      pass_threshold: 0.4

acceptance_criteria:
  - "Exactly two tool calls: create_order, then send_confirmation_email."
  - "`create_order` args equal customer_id=C-42 and items=[SKU-1, SKU-2]."
  - "`send_confirmation_email.order_id` equals the order_id returned by the prior create_order call."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.20
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - bfcl
  - multi-tool
  - ordering
  - deterministic
  - smoke-test
  - reasoning-sensitive
