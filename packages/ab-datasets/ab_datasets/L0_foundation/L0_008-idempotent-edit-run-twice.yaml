id: L0_008
layer: L0
suite: file-ops
title: "Idempotent version bump across 5 JSON files"
description: |
  The fixture seeds 5 JSON files at the workdir root:

      api.json   {"version": "0.1.0", "name": "api"}
      core.json  {"version": "0.1.0", "name": "core"}
      ui.json    {"version": "0.1.0", "name": "ui"}
      db.json    {"version": "0.1.0", "name": "db"}
      cli.json   {"version": "0.1.0", "name": "cli"}

  Each file has a trailing newline.

  The user asks (single combined prompt):

    "In every `*.json` at the workdir root, set the `version` field to
     `0.2.0`. The `name` field must remain unchanged. The JSON keys
     must stay in the same order — first key `version`, second key
     `name` — and the file must end with a single trailing newline.

     Idempotency: if your sequence of operations is replayed a second
     time against the original fixture, the final file content must
     be IDENTICAL to what one run produces (no double-bump, no extra
     keys, no whitespace drift)."

  Expected final state (all 5 files, byte-exact including trailing \\n):

      {"version": "0.2.0", "name": "<basename>"}\n

  Failure modes:
    - touching only some of the 5 files,
    - bumping to "0.2.1" or "0.10.0" (mis-parsing semver),
    - reordering keys to alpha (`name` before `version`),
    - adding extra keys / removing `name`,
    - adding a UTF-8 BOM,
    - non-idempotent edits (e.g. "increment minor by 1" → "0.3.0" on 2nd apply).

fixture_ref: "fixtures/repos/L0_smoke/L0_008/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: byte_exact_all_five
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "api.json"
          content: "{\"version\": \"0.2.0\", \"name\": \"api\"}\n"
        - kind: workdir_file_content_equals
          path: "core.json"
          content: "{\"version\": \"0.2.0\", \"name\": \"core\"}\n"
        - kind: workdir_file_content_equals
          path: "ui.json"
          content: "{\"version\": \"0.2.0\", \"name\": \"ui\"}\n"
        - kind: workdir_file_content_equals
          path: "db.json"
          content: "{\"version\": \"0.2.0\", \"name\": \"db\"}\n"
        - kind: workdir_file_content_equals
          path: "cli.json"
          content: "{\"version\": \"0.2.0\", \"name\": \"cli\"}\n"
        - kind: workdir_file_no_bom
          path: "api.json"
        - kind: workdir_file_no_bom
          path: "core.json"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 15, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 3000, max_tokens: 9000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 25000, max_ms: 75000, pass_threshold: 0.6}

acceptance_criteria:
  - "All 5 JSON files updated to version 0.2.0 with name unchanged."
  - "Key order preserved (version, then name)."
  - "Trailing newline present, no BOM."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - idempotency
  - batch-edit
  - hard
