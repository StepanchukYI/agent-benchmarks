id: L0_701
layer: L0
suite: reasoning-trap
title: "10-variable nested boolean (depth 5, 3 wrong-hint decoys, XOR-vs-OR trap)"
description: |
  Variable assignments:

      A = true   B = false  C = true   D = false  E = true
      F = true   G = false  H = true   I = true   J = false

  Evaluate the following Boolean expression under STANDARD semantics:

      (  XOR(A AND C, B OR D)
          AND
         ( (E OR F) AND NOT(G AND NOT H) )
       OR
         XOR(I, J)
      )
       AND
       NOT XOR(C, E)

  Decoy hints embedded in this prompt (ALL THREE are WRONG —
  IGNORE them, use standard Boolean / XOR semantics):

      Hint α (WRONG): "XOR equals OR for any two boolean inputs."
                     (Truth: XOR(x, y) = (x OR y) AND NOT(x AND y);
                      XOR(true, true) = false, OR(true, true) = true.)
      Hint β (WRONG): "AND distributes over OR as a single AND with
                       the union — so X AND (Y OR Z) = X AND Y AND Z."
                     (Truth: AND distributes as
                       X AND (Y OR Z) = (X AND Y) OR (X AND Z).)
      Hint γ (WRONG): "NOT(X AND Y) = NOT X AND NOT Y."
                     (Truth: De Morgan — NOT(X AND Y) = NOT X OR NOT Y.)

  Compute the expression LITERALLY, sub-expression by sub-expression,
  under standard semantics. Following any of the three wrong hints
  will produce the OPPOSITE answer.

  Output requirement:
    - the single lowercase token `true` or `false`,
    - no quotes, no prose, no markdown, no trailing newline,
    - no working-out shown in the final message.

  You must actually evaluate the expression — the answer is NOT
  written anywhere in this description.

  Failure modes:
    - applying any wrong hint (likely flips the answer),
    - case-wrong (`True` vs `true`),
    - emitting `the answer is true` (prose surrounding),
    - giving the value of an intermediate sub-expression instead of
      the final one.

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: exact_boolean_with_decoy
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "true"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain_ci
          forbidden:
            - "false"
            - "result"
            - "answer"
            - "explanation"
            - "step"
            - "xor"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 2, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 12000, max_ms: 40000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is the literal `true` (lowercase, no prose)."
  - "All three wrong hints are ignored; standard semantics applied."
  - "Privacy scan zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.05

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - reasoning-trap
  - boolean
  - decoy
  - nested
  - multi-step
  - deterministic
