id: L0_007
layer: L0
suite: file-ops
title: "4-segment non-contiguous read-and-stitch across a 2000-line file"
description: |
  The fixture provides `numbered.txt` with 2000 lines of the form
  `line 0001`, `line 0002`, ..., `line 2000` (4-digit zero-padded).

  The user asks:

    "Read the file and output ONLY the lines from these FOUR
     non-contiguous ranges, in this exact order:

         lines 10–15 (inclusive)       — 6 lines
         lines 500–505 (inclusive)     — 6 lines
         lines 1000–1005 (inclusive)   — 6 lines
         lines 1900–1905 (inclusive)   — 6 lines

     That's 24 lines total. One line per output line, no prose, no
     blank separators between segments, no line-number prefix."

  Expected output (24 lines, byte-exact, no trailing newline beyond
  the last line):

      line 0010
      line 0011
      ...
      line 0015
      line 0500
      ...
      line 0505
      line 1000
      ...
      line 1005
      line 1900
      ...
      line 1905

  Failure modes:
    - off-by-one inside any segment,
    - dumping the whole file,
    - adding blank lines between segments,
    - reordering (e.g. by ascending number across all segments — same here),
    - emitting line-number prefix or markdown fencing.

fixture_ref: "fixtures/repos/L0_smoke/L0_007/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: stitched_segments_check
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "line 0010\nline 0011\nline 0012\nline 0013\nline 0014\nline 0015\nline 0500\nline 0501\nline 0502\nline 0503\nline 0504\nline 0505\nline 1000\nline 1001\nline 1002\nline 1003\nline 1004\nline 1005\nline 1900\nline 1901\nline 1902\nline 1903\nline 1904\nline 1905"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 3000, max_tokens: 9000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 15000, max_ms: 45000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message contains exactly the 24 lines, in the four-segment order."
  - "No blank separators, no prose, no line-number prefix."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - multi-segment-read
  - byte-exact
  - hard
  - byte-exact-output
  - output-normalization-sensitive
