id: L0_403
layer: L0
suite: instruction-following
title: "JSON-only + strict key order + per-field word counts"
description: |
  The user prompt:

    "Return a JSON object describing the city of Marrakech. The object
     MUST have EXACTLY these top-level keys, in this order:

         name, country, founded_year, summary

     - name: string, must equal 'Marrakech' exactly.
     - country: string, must equal 'Morocco' exactly.
     - founded_year: integer, in [800, 1200].
     - summary: string, EXACTLY 17 words (Unicode-word count), no
       markdown.

     Output ONLY the JSON object. No surrounding prose. No markdown
     code fence. No trailing newline beyond a single one."

  This stacks three independent gates on top of the basic JSON-only
  test (was L0_403):
    1. all 4 required keys with correct types and value constraints,
    2. **top-level key order** is exactly [name, country, founded_year,
       summary] — JSON does not specify order, but the agent must emit
       them in this order in the literal,
    3. the `summary` field is **exactly 17 Unicode-words** (not 16 or
       18 — common drift modes for frontier models).

  Failure modes:
    - markdown code fence,
    - prose before / after the JSON literal,
    - keys present but in a different order,
    - summary word count not exactly 17,
    - founded_year out of [800, 1200] sanity band.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: json_strict_order_and_word_counts
    kind: deterministic
    config:
      assertions:
        - kind: no_prose_surrounding_json
        - kind: no_markdown_fence
        - kind: top_level_key_order
          expected:
            - name
            - country
            - founded_year
            - summary
        - kind: field_word_count
          field: summary
          expected: 17

      pass_threshold: 0.75
  - name: json_schema_check
    kind: schema
    config:
      input: "final_assistant_message"
      mode: "exact_json"
      schema:
        type: object
        required: [name, country, founded_year, summary]
        additionalProperties: false
        properties:
          name:
            type: string
            const: "Marrakech"
          country:
            type: string
            const: "Morocco"
          founded_year:
            type: integer
            minimum: 800
            maximum: 1200
          summary:
            type: string

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 0
      pass_threshold: 1.0

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 400
      max_tokens: 1500
      pass_threshold: 0.6

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 10000
      max_ms: 30000
      pass_threshold: 0.6

acceptance_criteria:
  - "Final message is exactly a JSON object, no prose, no fence."
  - "Top-level keys in exactly: name, country, founded_year, summary."
  - "name='Marrakech', country='Morocco', founded_year ∈ [800,1200]."
  - "summary contains exactly 17 Unicode-words."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - instruction-following
  - json
  - format-constraint
  - multi-constraint
  - key-order
  - word-count
  - deterministic
  - hard
  - byte-exact-output
  - output-normalization-sensitive
