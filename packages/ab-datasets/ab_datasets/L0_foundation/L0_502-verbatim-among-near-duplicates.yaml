id: L0_502
layer: L0
suite: faithfulness
title: "Near-duplicates differing only in punctuation: pick the exact paragraph"
description: |
  The fixture `source.txt` lists FIVE paragraphs (P1..P5) which are
  byte-identical except for ONE punctuation mark in the middle:

      P1: "The bell at Saltmoor tolls thrice at dusk; its echo is heard across the bay."
      P2: "The bell at Saltmoor tolls thrice at dusk, its echo is heard across the bay."
      P3: "The bell at Saltmoor tolls thrice at dusk: its echo is heard across the bay."
      P4: "The bell at Saltmoor tolls thrice at dusk — its echo is heard across the bay."
      P5: "The bell at Saltmoor tolls thrice at dusk. Its echo is heard across the bay."

  The user asks:

    "Look at the five paragraphs in source.txt. Output ONLY the
     paragraph whose middle punctuation is a COLON (`:`). Output
     the body of the paragraph exactly as written (no `P3:` label,
     no surrounding quotes, no prose). One single line."

  Expected exact:

      The bell at Saltmoor tolls thrice at dusk: its echo is heard across the bay.

  This pattern is RULER-style "verbatim among near-duplicates" but on a
  punctuation-only axis — exposes models that normalise punctuation
  during retrieval (they collapse `;`, `,`, `:`, `—`, `.` to the same
  cluster).

  Failure modes:
    - returning the semicolon paragraph (most similar visual),
    - returning the dash paragraph (em-dash mistaken for colon),
    - including the `P3:` label,
    - paraphrasing.

fixture_ref: "fixtures/repos/L0_smoke/L0_502/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: punctuation_exact_match
    kind: deterministic
    config:
      source_file: "source.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "The bell at Saltmoor tolls thrice at dusk: its echo is heard across the bay."
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "P1"
            - "P2"
            - "P3"
            - "P4"
            - "P5"
            - "; its echo"
            - ", its echo"
            - "— its echo"
            - ". Its echo"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 3, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 1000, max_tokens: 4000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 15000, max_ms: 45000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message equals the colon-variant paragraph byte-for-byte."
  - "Other four near-duplicate punctuations not present."
  - "No `Pn:` label, no surrounding quotes."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - faithfulness
  - verbatim
  - punctuation-sensitive
  - near-duplicates
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
