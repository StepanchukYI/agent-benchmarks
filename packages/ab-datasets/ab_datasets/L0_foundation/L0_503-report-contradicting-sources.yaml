id: L0_503
layer: L0
suite: faithfulness
title: "5-set contradiction classification chain with sha1 fingerprint"
description: |
  Below are 5 question-and-sources sets. For each set, three labelled
  sources provide information related to the question. Classify each
  set as `1` if the three sources mutually CONTRADICT each other (no
  single answer can be honestly given), or `0` if the sources are
  CONSISTENT (a single answer can be safely given).

  ─── SET 1: Atlas project public-beta date ───
    A: "Atlas's public beta launches on 14 March 2027."
    B: "Atlas's public beta launches on 21 March 2027."
    C: "Atlas's public beta launches on 14 March 2027."
    → 2 of 3 disagree (B differs) → CONTRADICTION → 1

  ─── SET 2: Tornmoor population ───
    A: "Tornmoor's 2026 population is 47,200."
    B: "Tornmoor's 2026 population is reported as 47,200 in the regional census."
    C: "Tornmoor: 47,200 residents (2026)."
    → all agree → 0

  ─── SET 3: Compound X melting point ───
    A: "Compound X melts at 124 °C."
    B: "Compound X melts at 132 °C."
    C: "Compound X melts at 124 °C."
    → A=C disagree with B → CONTRADICTION → 1

  ─── SET 4: Saltmoor bridge length ───
    A: "Saltmoor bridge is 412 m long."
    B: "Saltmoor bridge is 380 m long."
    C: "Saltmoor bridge is 412 m long."
    → A=C disagree with B → CONTRADICTION → 1

  ─── SET 5: Acme Widget Q2 revenue ───
    A: "Acme Widget Q2 revenue: $91.7M."
    B: "Acme Widget Q2 revenue: $91.7M."
    C: "Acme Widget Q2 revenue: $91.7M."
    → all agree → 0

  Chain = "<a1><a2><a3><a4><a5>" — five binary digits glued.
  For this set the chain is `10110`. Compute lowercase hex SHA-1 of
  the 5-char chain (UTF-8) and emit ONLY the 40-character digest.

  Failure modes:
    - silently picking one of the disagreeing values without flagging,
    - flagging trivial paraphrase differences as contradictions,
    - emitting the chain instead of the sha1.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: contradiction_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "089e94bf8ffef5d8b5d0293f3c184677c556a7dd"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "10110"
            - "SET"
            - "contradiction"
            - "step"
            - "Atlas"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 4, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2500, max_tokens: 7000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 20000, max_ms: 65000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `10110`."
  - "All 5 contradiction classifications correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - faithfulness
  - contradiction
  - multi-step
  - sha1-fingerprint
  - hard
  - reasoning-sensitive
