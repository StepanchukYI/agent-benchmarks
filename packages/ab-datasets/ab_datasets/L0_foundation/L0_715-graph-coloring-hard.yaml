id: L0_715
layer: L0
suite: reasoning-trap
title: "Chromatic numbers of 5 graphs + sha1 fingerprint"
description: |
  Compute the chromatic number χ(G) — the minimum number of colours
  required so that no two adjacent vertices share a colour — for each
  of the FIVE undirected graphs below.

      G1 — vertices {1,2,3}; edges {(1,2),(2,3),(1,3)}.
           (A triangle / K3.)

      G2 — vertices {1,2,3,4}; edges {(1,2),(2,3),(3,4),(4,1)}.
           (A 4-cycle / C4.)

      G3 — vertices {1,2,3,4}; edges
           {(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)}.
           (Complete graph K4.)

      G4 — vertices {1,2,3,4,5}; edges {(1,2),(2,3),(3,4),(4,5)}.
           (Path P5.)

      G5 — vertices {1,2,3,4,5}; edges
           {(1,2),(1,3),(2,3),(2,4),(3,4),(4,5)}.
           (Two overlapping triangles 1-2-3 and 2-3-4 plus pendant edge 4-5.)

  Compute χ(G1), χ(G2), χ(G3), χ(G4), χ(G5) — five integers in order.
  Concatenate them as decimal strings separated by `,` (comma, no
  spaces):

      chain = "<χ1>,<χ2>,<χ3>,<χ4>,<χ5>"

  Compute the lowercase hex SHA-1 of `chain` (UTF-8 bytes, no trailing
  newline). Emit ONLY the 40-character hex digest as the final
  message. No prose, no markdown, no quotes.

  Walk-through verification:
    - G1: K3 contains triangle ⇒ χ ≥ 3; 3-colourable ⇒ χ=3.
    - G2: C4 is bipartite ⇒ χ=2.
    - G3: K4 ⇒ χ=4.
    - G4: P5 is bipartite ⇒ χ=2.
    - G5: Triangles ⇒ χ ≥ 3; 3-colour: {1=A, 2=B, 3=C, 4=A, 5=B} ⇒ χ=3.

  Expected chain = "3,2,4,2,3". (Model must NOT emit this — only sha1.)

  Failure modes:
    - emitting the chain string instead of sha1,
    - off-by-one on χ(G3) (returning 3 — common misread of K4 as K3),
    - misclassifying G5 as 4-chromatic (need to verify it's 3-colourable),
    - prose around the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: chromatic_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "6378ac531fc666b23721f9a9d36a90f61b63aa89"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "3,2,4,2,3"
            - ","
            - "chromatic"
            - "step"
            - "answer"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 6, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `3,2,4,2,3`."
  - "All five chromatic numbers correctly computed."
  - "No prose, no chain in output."
  - "Privacy scan produces zero hits."

