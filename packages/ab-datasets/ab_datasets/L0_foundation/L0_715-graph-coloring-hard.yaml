id: L0_715
layer: L0
suite: reasoning-trap
title: "Chromatic number of a small graph (hard)"
description: |
  Consider the undirected graph G on 5 vertices {1, 2, 3, 4, 5} with
  edge set:

      E = {
        (1, 2), (1, 3), (1, 4),
        (2, 3), (2, 5),
        (3, 4), (3, 5),
        (4, 5)
      }

  What is the chromatic number of G — i.e. the minimum number of
  colours needed so that no two adjacent vertices share a colour?

  Reasoning:
    - Vertices {2, 3, 5} form a triangle (edges 2-3, 3-5, 2-5) →
      need at least 3 colours.
    - Vertices {1, 2, 3, 4} include the triangle 1-2-3 plus edge
      1-4 and 3-4 — so {1,3,4} also form a triangle.
    - Check whether the graph is 3-colourable: a 3-colouring exists
      iff the graph has no 4-clique. The 4 vertices {1, 2, 3, 4}
      are NOT all pairwise adjacent (no edge 2-4) → no 4-clique.
    - Explicit 3-colouring:
        colour(1) = A,  colour(2) = B,  colour(3) = C,
        colour(4) = B,  colour(5) = A.
      Check every edge — all endpoints differ. So χ(G) = 3.

  Output ONLY the single digit `3` — no prose, no trailing newline.

