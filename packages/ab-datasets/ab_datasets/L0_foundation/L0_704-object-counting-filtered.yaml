id: L0_704
layer: L0
suite: reasoning-trap
title: "5-axis object counting chain with sha1 fingerprint"
description: |
  Solve all 5 of the following independent counting problems exactly
  as specified, then chain the 5 integer results into a sha1 digest.

  Q1 — Vowel-initial words.
      list = ["amber", "stone", "echo", "rover", "ivy", "tower",
              "umbra", "lake", "ash", "wren"]
      Count words whose first character (case-folded) is in
      {a,e,i,o,u}. Yield N1.

  Q2 — Even numbers.
      list = [3, 7, 12, 4, 19, 25, 8, 11, 6, 2, 14, 30, 9, 5, 17, 1, 23, 100]
      Count values where value % 2 == 0. Yield N2.

  Q3 — String length strictly greater than 5.
      list = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta",
              "eta", "theta", "iota"]
      Count items where len(s) > 5 (5 itself does NOT count).
      Yield N3.

  Q4 — Strictly greater than median.
      list = [3, 7, 1, 4, 9, 2, 6, 8, 5]
      Compute median as the middle element after sorting (for odd-
      length list = element at index N//2 of the sorted list).
      Count values > median (strictly, no ties). Yield N4.

  Q5 — Prime values in dict.
      d = {"a": 2, "b": 4, "c": 5, "d": 6, "e": 7, "f": 9, "g": 11, "h": 12}
      Count values v where v is a prime number (2,3,5,7,11,...). 1
      is NOT prime. Yield N5.

  Chain = "<N1>,<N2>,<N3>,<N4>,<N5>" (comma, no spaces).
  Compute lowercase hex SHA-1 of chain (UTF-8 bytes, no trailing
  newline). Emit ONLY the 40-character hex digest. No prose, no
  markdown, no working-out.

  Failure modes:
    - off-by-one on any single N_i (one wrong → wrong digest),
    - treating 1 as prime in Q5,
    - using strictly-less-than where strict-greater is asked,
    - emitting the chain string instead of the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: counting_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "adf65eac2001d9b1924e4a8a8232631b5344eb54"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "5,8,1,4,4"
            - "N1"
            - "step"
            - "answer"
            - ","

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `5,8,1,4,4`."
  - "All 5 counts correctly computed."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

