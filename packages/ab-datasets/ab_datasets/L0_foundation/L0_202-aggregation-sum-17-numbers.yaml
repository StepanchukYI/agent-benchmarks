id: L0_202
layer: L0
suite: long-context-aggregation
title: "Aggregation: 23 entries — numerals, word-numbers, and negatives mixed"
description: |
  The fixture provides `haystack.txt` (~16 KB, 65 paragraphs of
  distractor prose). Exactly 23 paragraphs contain one inventory log
  entry each. The entries take three forms, all matching the prefix
  `Inventory log entry`:

    - 18 numerals (positive integers): values from a deterministic set
    - 3 word-numbers: `twelve`, `thirty-four`, `eighty-one`
    - 2 negatives: `-7` and `-15`

  Total of all 23 values, with words parsed to integers and negatives
  honoured: **401**

  The user asks:

    "Scan haystack.txt. Every paragraph containing the prefix
     `Inventory log entry` is an entry. Sum the numerical values
     across all entries — including the three word-numbers `twelve`,
     `thirty-four`, `eighty-one` and the two negative numerals. Output
     ONLY the resulting integer. No prose, no commas, no sign on
     positive output."

  Expected exact: `401`.

  Failure modes:
    - returning the sum of numerals only (skipping word-numbers): 296,
    - skipping negatives (treating them as 0 or positive): 423 or 445,
    - returning `196` (old expected from the v1 fixture),
    - emitting `401.0` (float),
    - emitting `4,01` or `401,` (locale/format errors).

fixture_ref: "fixtures/repos/L0_smoke/L0_202/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: total_sum_check
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "401"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - ","
            - "."
            - "sum"
            - "total"
            - "answer"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 3, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 6000, max_tokens: 15000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 25000, max_ms: 75000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message equals `401` exactly."
  - "Word-numbers and negatives both included in sum."
  - "No prose, no commas."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - aggregation
  - mixed-numerics
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
