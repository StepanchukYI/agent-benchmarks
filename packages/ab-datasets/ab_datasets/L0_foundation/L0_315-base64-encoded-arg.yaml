id: L0_315
layer: L0
suite: tool-use
title: "Encode binary payload as base64 in a record (correct charset, lowercase content_type)"
description: |
  You have access to a bash shell. The "upload blob" record has three
  fields:

      filename     — string
      content_type — string matching `^[a-z0-9.+\-/]+$` (lowercase only)
      data         — standard base64 of the raw file bytes

  The user request:

      "Upload a file named `hello.txt` of MIME type `text/plain`
       containing the exact UTF-8 string `Hello, blob!` (12 bytes,
       NO trailing newline)."

  Compute the standard base64 of the 12 raw bytes `Hello, blob!`.
  Standard base64 of 12 bytes is 16 chars with no padding:

      base64(b"Hello, blob!") = "SGVsbG8sIGJsb2Ih"

  Create the file `out/upload.json` whose contents are exactly the
  following bytes, byte-for-byte (no whitespace, no trailing newline,
  keys in the order shown):

      {"filename":"hello.txt","content_type":"text/plain","data":"SGVsbG8sIGJsb2Ih"}

  A one-shot pipeline (handles macOS and GNU `base64`):

      mkdir -p out
      DATA=$(printf '%s' 'Hello, blob!' | base64 | tr -d '\n')
      printf '{"filename":"hello.txt","content_type":"text/plain","data":"%s"}' \
          "$DATA" > out/upload.json

  macOS `base64` appends a trailing newline; `tr -d '\n'` strips it.
  GNU `base64 -w0` is an alternative.

  Skill measured: produce a record that satisfies the LOWERCASE
  `content_type` constraint AND uses standard (not URL-safe) base64
  WITHOUT any trailing newline inside the `data` field.

  Failure modes:
    - `content_type` not lowercase (e.g. `Text/Plain`),
    - `data` is the raw string `Hello, blob!` instead of base64,
    - URL-safe base64 variant (no `+`/`/` in this payload, so the
      digest happens to be the same — but the spec pins standard),
    - trailing `\n` inside the JSON `data` value,
    - extra keys, key reorder, or any other byte drift.

fixture_ref: "fixtures/repos/L0_smoke/L0_315/"

