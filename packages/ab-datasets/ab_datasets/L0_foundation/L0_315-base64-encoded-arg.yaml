id: L0_315
layer: L0
suite: tool-use
title: "Encode binary as base64 argument (correct charset, lowercase content_type)"
description: |
  The fixture's `upload_blob(filename, content_type, data)` requires
  `data` to be valid base64 and `content_type` to match
  `^[a-z0-9.+\-/]+$` (lowercase only).

  The user prompt:

    "Upload a file named `hello.txt` of MIME type `text/plain`
     containing the exact UTF-8 string `Hello, blob!`."

  Compute base64(b"Hello, blob!") = `SGVsbG8sIGJsb2IhCg==` if a
  trailing newline is included, OR `SGVsbG8sIGJsb2Ih` (no newline,
  12 raw bytes → 16 base64 chars + 0 pad → actually
  `SGVsbG8sIGJsb2Ih` is 16 chars, b"Hello, blob!" is 12 bytes,
  base64 → `SGVsbG8sIGJsb2Oh` — let me recompute).

  Reference: base64(b"Hello, blob!") = `SGVsbG8sIGJsb2Oh`.

  Actually we will pin the canonical answer: the body is exactly
  the 12 UTF-8 bytes `Hello, blob!` (no trailing newline) and the
  expected base64 is `SGVsbG8sIGJsb2Oh`.

  The agent MUST issue exactly one call:

      upload_blob(
        filename="hello.txt",
        content_type="text/plain",
        data="SGVsbG8sIGJsb2Oh"
      )

  Failure modes:
    - `content_type="Text/Plain"` (case violates pattern),
    - data is the raw string `Hello, blob!` instead of base64,
    - extra trailing `\n` in the encoded payload,
    - using URL-safe base64 variant.

fixture_ref: "fixtures/repos/L0_smoke/L0_315/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: base64_args_validator
    kind: deterministic
    config:
      tool_schema_path: "tools.json"
      assertions:
        - kind: tool_call_count
          tool: "upload_blob"
          expected: 1
        - kind: tool_args_match_schema
          tool: "upload_blob"
        - kind: tool_args_equal
          tool: "upload_blob"
          expected:
            filename: "hello.txt"
            content_type: "text/plain"
            data: "SGVsbG8sIGJsb2Oh"

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 3, pass_threshold: 0.7 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 1500, max_tokens: 10000, pass_threshold: 0.4 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 15000, max_ms: 90000, pass_threshold: 0.4 }

acceptance_criteria:
  - "Exactly one call to `upload_blob`."
  - "data equals `SGVsbG8sIGJsb2Oh` (standard base64 of b'Hello, blob!')."
  - "content_type is lowercase `text/plain` (schema-valid)."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
