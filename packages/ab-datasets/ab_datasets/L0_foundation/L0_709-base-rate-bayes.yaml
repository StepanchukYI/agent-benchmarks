id: L0_709
layer: L0
suite: reasoning-trap
title: "5 Bayesian posterior chain with sha1 fingerprint"
description: |
  Solve all 5 Bayesian inference problems. Each gives:
    - prior P(D) — base rate of the condition
    - sens — sensitivity = P(+ | D)
    - fp   — false-positive rate = P(+ | ¬D)

  For each, compute posterior:
      P(D | +) = sens · P(D) / (sens · P(D) + fp · (1 − P(D)))

  Round each posterior to EXACTLY 4 decimal places using banker's
  rounding NOT — use Python's default `round()` (banker's), but for
  these inputs the difference is irrelevant. Equivalent: format with
  Python `f"{x:.4f}"`. Result string for each problem is the
  zero-prefixed decimal (e.g. `0.1667`, NOT `.1667` and NOT `0.1667000`).

  Problems (prior, sens, fp):
    Q1: 0.01,  0.99, 0.05
    Q2: 0.02,  0.95, 0.10
    Q3: 0.05,  0.90, 0.20
    Q4: 0.001, 0.99, 0.01
    Q5: 0.10,  0.80, 0.30

  Chain = "<P1>|<P2>|<P3>|<P4>|<P5>" — pipes between problems.

  Compute lowercase hex SHA-1 of the chain (UTF-8). Emit ONLY the
  40-character digest. No prose, no markdown.

  Failure modes:
    - dropping the leading zero (writing `.1667` instead of `0.1667`),
    - emitting 3 or 5 decimals instead of 4 (`0.167` or `0.16667`),
    - confusing sensitivity (P(+|D)) with specificity (P(−|¬D)),
    - using 1−fp inside the denominator (mis-applying Bayes),
    - emitting the chain instead of the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: bayes_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "8c975f1fc459c1e3290c36245a99f23ec86fe81d"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "0.1667"
            - "|"
            - "posterior"
            - "Bayes"
            - "step"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of the 5-posterior chain."
  - "Each posterior to 4 decimals with leading zero."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

