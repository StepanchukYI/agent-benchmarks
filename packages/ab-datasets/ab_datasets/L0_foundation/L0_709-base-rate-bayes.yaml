id: L0_709
layer: L0
suite: reasoning-trap
title: "Base-rate / Bayes probability trap (false-positive)"
description: |
  A diagnostic test is 99% accurate (in the sense that the
  sensitivity = 99% AND the specificity = 99%). The disease has a
  base rate of 1 in 10,000 in the population. A randomly chosen
  person tests POSITIVE. What is the probability they actually
  have the disease?

  Build the 2×2 table per 1,000,000 people:
    - Diseased: 1,000,000 × 1/10,000 = 100.
    - Not diseased: 999,900.
    - True positives (diseased AND positive): 100 × 0.99 = 99.
    - False positives (not-diseased AND positive): 999,900 × 0.01
      = 9,999.
    - Total positives: 99 + 9,999 = 10,098.
    - P(disease | positive) = 99 / 10,098 ≈ 0.0098.

  As a percentage rounded to TWO decimal places: `0.98`.

  The user prompt:

    "What percentage chance does this person actually have the
     disease, given that they tested positive? Output ONLY a
     decimal percentage rounded to TWO decimal places, no `%` sign,
     no prose. (e.g. `42.50` for 42.5%.)"

  Expected: `0.98`.

  Common wrong answers:
    - `99` (confused test accuracy with posterior),
    - `99.00` (same trap),
    - `0.01` (forgot to multiply by 100),
    - `1.00` (off-by-rounding).

fixture_ref:

config:
  required_tier: T0
