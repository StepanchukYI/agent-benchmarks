id: L0_710
layer: L0
suite: reasoning-trap
title: "5 UTC→local timezone conversion chain with sha1 fingerprint"
description: |
  Convert 5 UTC timestamps to local time using the FIXED offset
  provided for each problem (NO daylight-saving — apply the given
  offset literally as `local = utc + offset`).

  For each problem, output the local time in ISO 8601 format
  `YYYY-MM-DDTHH:MM` (no seconds, no `Z` suffix, no timezone label,
  T separator capitalised).

  Problems (UTC time, fixed offset to apply):
    Q1: 2027-03-10 14:00  +05:30
    Q2: 2027-07-04 23:00  -08:00
    Q3: 2027-12-31 18:00  +13:00
    Q4: 2027-06-15 06:30  -03:30
    Q5: 2027-09-22 11:15  +09:45

  Walk-through (only Q1 shown; the model must compute all 5):
    Q1: 14:00 + 5:30 = 19:30 same day → "2027-03-10T19:30"

  Note Q3 crosses the year boundary: 2027-12-31 18:00 UTC + 13h →
  2028-01-01 07:00.

  Chain = "<L1>|<L2>|<L3>|<L4>|<L5>" — pipes between conversions.

  Compute lowercase hex SHA-1 of the chain (UTF-8). Emit ONLY the
  40-character digest. No prose, no markdown.

  Failure modes:
    - using `T` lowercase (`2027-03-10t19:30`),
    - including timezone label (`...+05:30` or `Z`),
    - including seconds (`:00`),
    - failing year rollover on Q3,
    - emitting the chain string instead of the digest.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: tz_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "03962f91305cb9a69da90f6e5052daec9f0cad98"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "2027-"
            - "2028-"
            - "|"
            - "step"
            - "UTC"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of the 5-conversion chain."
  - "Each local time formatted as `YYYY-MM-DDTHH:MM`."
  - "Q3 year rollover handled correctly."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

