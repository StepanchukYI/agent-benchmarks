id: L0_702
layer: L0
suite: reasoning-trap
title: "Logical deduction: assign 3 people to 3 attributes (BBH-style)"
description: |
  Three colleagues — Idris, Lyra, and Toren — each took a different
  trip last summer: one to Saltmoor, one to Vyport, one to
  Brumcastle. The following clues are all true:

      1. Lyra did not go to Saltmoor.
      2. The colleague who went to Vyport is NOT Idris.
      3. Toren went neither to Vyport nor to Brumcastle.

  Walk through:
    - From (3): Toren went to Saltmoor.
    - From (1): Lyra did not go to Saltmoor (consistent).
    - From (2): Idris did not go to Vyport, so Idris went to Brumcastle.
    - Therefore Lyra went to Vyport.

  Final assignment: Idris=Brumcastle, Lyra=Vyport, Toren=Saltmoor.

  The user prompt:

    "Given these clues, output one line per person in alphabetical
     order by name, format `<name>=<city>`. Output ONLY the three
     lines, no prose."

  Expected (exact, 3 lines):

      Idris=Brumcastle
      Lyra=Vyport
      Toren=Saltmoor

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_assignment
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "Idris=Brumcastle\nLyra=Vyport\nToren=Saltmoor"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 0, pass_threshold: 1.0 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 700, max_tokens: 5000, pass_threshold: 0.5 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 12000, max_ms: 60000, pass_threshold: 0.5 }

acceptance_criteria:
  - "Final message is exactly the three required lines in alphabetical order."
  - "All assignments are correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

