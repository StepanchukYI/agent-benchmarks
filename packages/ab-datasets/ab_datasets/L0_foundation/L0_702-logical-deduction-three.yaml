id: L0_702
layer: L0
suite: reasoning-trap
title: "Logical deduction: 5 people × 5 cities, 7 chained clues"
description: |
  Five colleagues — Alia, Boris, Cyan, Dax, Era — each travelled to a
  different city last summer: Saltmoor, Vyport, Brumcastle, Yarrow,
  Tornmoor. The following 7 clues are all simultaneously true:

      1. Alia did not go to Saltmoor.
      2. Boris went to either Vyport or Yarrow.
      3. The traveller to Brumcastle has a four-letter first name.
      4. Cyan went neither to Tornmoor nor to Vyport.
      5. Dax's destination starts with a letter that comes
         alphabetically BEFORE the first letter of Era's destination.
      6. The traveller to Vyport's name comes alphabetically BEFORE
         the traveller to Yarrow's name.
      7. Dax went to a city whose first letter is NOT in {S, V}.

  Walk-through (one valid solution; uniqueness verified by hand-check):
    - From (3): traveller to Brumcastle has 4 letters. Among
      {Alia(4), Boris(5), Cyan(4), Dax(3), Era(3)}, only Alia or Cyan.
    - (1) rules out Alia=Saltmoor; doesn't rule out Alia=Brumcastle.
    - (4) says Cyan ∉ {Tornmoor, Vyport}. Cyan ∈ {Saltmoor, Brumcastle, Yarrow}.
    - Combining (3)+(4): if Cyan=Brumcastle, but then (7) on Dax + the
      remaining constraints over-constrain to NO solution. Therefore
      Alia=Brumcastle.
    - (2): Boris ∈ {Vyport, Yarrow}. (6): Vyport-name < Yarrow-name
      alphabetically. If Boris=Yarrow, then someone with name < B goes
      to Vyport — only Alia qualifies, but Alia=Brumcastle.
      Therefore Boris=Vyport.
    - (7): Dax ∉ city starting with S or V. So Dax ∈ {Tornmoor, Yarrow}.
    - (5): Dax's letter < Era's letter. If Dax=Yarrow (Y), Era's
      first letter > Y — impossible. So Dax=Tornmoor (T).
    - Era ∈ remaining = {Saltmoor, Yarrow}. From (5) T<Era's first
      letter, so Era ∈ {Yarrow}. Era=Yarrow.
    - Cyan = Saltmoor (last city).

  Final:
    Alia=Brumcastle
    Boris=Vyport
    Cyan=Saltmoor
    Dax=Tornmoor
    Era=Yarrow

  User prompt:

    "Given the 7 clues, output 5 lines in alphabetical order by name
     using the format `<name>=<city>`. Output ONLY those 5 lines, no
     prose, no markdown."

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: exact_assignment_5
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "Alia=Brumcastle\nBoris=Vyport\nCyan=Saltmoor\nDax=Tornmoor\nEra=Yarrow"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 2, pass_threshold: 1.0}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 1000, max_tokens: 3500, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 15000, max_ms: 45000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is exactly the five required lines in alphabetical order."
  - "All five assignments correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

