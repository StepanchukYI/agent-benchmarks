id: L0_020
layer: L0
suite: exec
title: "3-step bash chain: filter → dedupe → count, with persistent intermediates"
description: |
  The fixture provides `raw.txt` (16 lines) — a mixture of `STATUS:`,
  `INFO:`, `DEBUG:`, `WARN:` lines. Some `STATUS:` lines are duplicates.

  The user asks (single prompt):

    "Perform a 3-step pipeline using bash, leaving every intermediate
     file persisted on disk:

       step 1 — filter only the lines that START with the literal
                prefix `STATUS:` and write them, in original order,
                to `out/filtered.txt` (trailing newline at end of file).
       step 2 — read `out/filtered.txt` and remove DUPLICATE lines,
                preserving first-seen order (do NOT sort). Write the
                result to `out/deduped.txt` (trailing newline).
       step 3 — count the number of lines in `out/deduped.txt` and
                write the integer (no trailing newline) to
                `out/count.txt`.

     All three files must exist at the end of the run. The agent must
     not delete intermediates."

  Expected file contents (computed from the fixture, deterministic):

      out/filtered.txt: 11 STATUS: lines (with duplicates) + trailing \n
      out/deduped.txt: 8 unique STATUS: lines in first-seen order
      out/count.txt:   exactly the single byte `8` — no newline

  Failure modes:
    - using `sort -u` instead of awk-based dedupe (sorts alphabetically),
    - including non-STATUS lines in filtered.txt,
    - emitting trailing newline in count.txt,
    - deleting an intermediate file at the end,
    - writing count.txt as `8\n` (newline counted as content).

fixture_ref: "fixtures/repos/L0_smoke/L0_020/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: three_step_pipeline_check
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/filtered.txt"
          content: "STATUS: alpha-build OK\nSTATUS: beta-build OK\nSTATUS: alpha-build OK\nSTATUS: gamma-build FAIL\nSTATUS: delta-build OK\nSTATUS: beta-build OK\nSTATUS: epsilon-build SKIP\nSTATUS: zeta-build OK\nSTATUS: alpha-build OK\nSTATUS: omicron-build OK\nSTATUS: pi-build OK\nSTATUS: epsilon-build SKIP\n"
        - kind: workdir_file_content_equals
          path: "out/deduped.txt"
          content: "STATUS: alpha-build OK\nSTATUS: beta-build OK\nSTATUS: gamma-build FAIL\nSTATUS: delta-build OK\nSTATUS: epsilon-build SKIP\nSTATUS: zeta-build OK\nSTATUS: omicron-build OK\nSTATUS: pi-build OK\n"
        - kind: workdir_file_content_equals
          path: "out/count.txt"
          content: "8"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 8, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 25000, max_ms: 75000, pass_threshold: 0.6}

acceptance_criteria:
  - "All three intermediate files exist with byte-exact content."
  - "Dedupe preserves first-seen order (no sort)."
  - "out/count.txt has no trailing newline."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.10
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - exec
  - bash
  - multi-step
  - state-chain
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
