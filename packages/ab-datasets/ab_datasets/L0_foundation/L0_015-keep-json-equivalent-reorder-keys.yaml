id: L0_015
layer: L0
suite: file-ops
title: "JSON edit preserving semantic equivalence (reorder keys, no value drift)"
description: |
  The fixture `data.json` contains:

      {"items":[{"id":1,"name":"alpha"},{"id":2,"name":"beta"},{"id":3,"name":"gamma"}]}

  The user asks:

    "Edit data.json so that the new file is pretty-printed with
     2-space indentation, one item per line for the `items` array,
     and each item's keys reordered to `name` first then `id`.
     All semantic content (values) must remain byte-for-byte
     identical (no renumbering, no renaming, no extra items). The
     file must parse to a JSON value equivalent (deep equal) to
     the original."

  Expected exact content:

      {
        "items": [
          {
            "name": "alpha",
            "id": 1
          },
          {
            "name": "beta",
            "id": 2
          },
          {
            "name": "gamma",
            "id": 3
          }
        ]
      }

  Trailing newline required. Failure modes:
    - any value change (semantic drift),
    - wrong indentation level,
    - keys not in `name`, `id` order,
    - extra items.

fixture_ref: "fixtures/repos/L0_smoke/L0_015/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: exact_json_pretty
    kind: deterministic
    config:
      expected:
        data.json: "{\n  \"items\": [\n    {\n      \"name\": \"alpha\",\n      \"id\": 1\n    },\n    {\n      \"name\": \"beta\",\n      \"id\": 2\n    },\n    {\n      \"name\": \"gamma\",\n      \"id\": 3\n    }\n  ]\n}\n"

  - name: json_semantic_equivalent
    kind: schema
    config:
      target: "data.json"
      mode: "json_value_equals"
      expected:
        items:
          - {id: 1, name: "alpha"}
          - {id: 2, name: "beta"}
          - {id: 3, name: "gamma"}

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 5, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 1500, max_tokens: 4000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 15000, max_ms: 45000, pass_threshold: 0.6}

acceptance_criteria:
  - "data.json matches the expected pretty-printed byte content."
  - "Parsed JSON is semantically equivalent to the original."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - json
  - pretty-print
  - semantic-equivalence
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
