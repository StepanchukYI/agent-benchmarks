id: L0_002
layer: L0
suite: file-ops
title: "3-file content rotation: a→b→c→a in one atomic pass"
description: |
  The fixture seeds three files in the workdir:

      a.py    -> body: `def greet():\n    return 'hello from a'\n`
      b.py    -> body: `def greet():\n    return 'hello from b'\n`
      c.py    -> body: `def greet():\n    return 'hello from c'\n`

  The user asks:

    "Rotate the *contents* of these three files such that:
       - a.py's final body is what was in c.py originally,
       - b.py's final body is what was in a.py originally,
       - c.py's final body is what was in b.py originally.

     The three filenames must remain a.py / b.py / c.py. No new files,
     no deleted files, no `.tmp` / `.bak` intermediates left behind.
     The agent's tool calls must not produce any intermediate file
     visible at the end of the run."

  Failure modes:
    - leaving a `tmp.py` or `a.py.bak` after the rotation,
    - rotating the wrong direction (b→a→c→b),
    - producing only two files (overwrite collision),
    - leaving any byte off due to whitespace re-flow.

fixture_ref: "fixtures/repos/L0_smoke/L0_002/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: rotation_check
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "a.py"
          content: "def greet():\n    return 'hello from c'\n"
        - kind: workdir_file_content_equals
          path: "b.py"
          content: "def greet():\n    return 'hello from a'\n"
        - kind: workdir_file_content_equals
          path: "c.py"
          content: "def greet():\n    return 'hello from b'\n"
        - kind: workdir_file_absent
          path: "tmp.py"
        - kind: workdir_file_absent
          path: "a.py.bak"
        - kind: workdir_file_absent
          path: "b.py.bak"
        - kind: workdir_file_absent
          path: "c.py.bak"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 10, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 25000, max_ms: 75000, pass_threshold: 0.6}

acceptance_criteria:
  - "Three files rotated: a<-c, b<-a, c<-b (content-wise)."
  - "No intermediate tmp / bak files left behind."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.70
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.10
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - rotation
  - atomic
  - hard
  - byte-exact-output
  - output-normalization-sensitive
