id: L0_405
layer: L0
suite: instruction-following
title: "Override default Python habits: 6 simultaneous formatting constraints"
description: |
  The user prompt:

    "Write a Python function `triple(x)` that returns `x * 3`. The
     function MUST satisfy ALL of these constraints simultaneously
     (any one violated → fail):

       1. Exactly 5 lines including the `def` line and the return
          line. No more, no less. Blank lines count as a line.
       2. NO type hints anywhere (no `int`, `: x: int`, `-> int`).
       3. NO docstring (no triple-quoted string anywhere).
       4. The return statement uses the multiplication operator `*`
          (NOT `+`, NOT `x.__mul__`, NOT a loop).
       5. Indent is EXACTLY 4 spaces (not 2, not a tab).
       6. No trailing whitespace on any line; final newline at end
          of the response.

     Output ONLY the function code — no surrounding prose, no
     markdown code fence, no comments inside the body."

  Expected output (byte-exact, 5 lines + trailing \\n):

      def triple(x):
          y = x * 3
          z = y
          w = z
          return w

  This deliberately forces the model to violate its STRONG bias to
  write the canonical 2-line `def triple(x): return x * 3`. The
  5-line constraint can be satisfied by any 3 intermediate
  assignments — the byte-exact match below uses y/z/w.

  Failure modes:
    - canonical 2-line implementation (1 line short),
    - including docstring,
    - including type hints (`def triple(x: int) -> int:`),
    - using `return x + x + x` (constraint 4),
    - markdown code fence around it,
    - prose explanation.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: override_python_check
    kind: deterministic
    config:
      pass_threshold: 0.7
      assertions:
        - kind: final_assistant_message_equals
          expected: "def triple(x):\n    y = x * 3\n    z = y\n    w = z\n    return w"
          trim_trailing_newline: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "->"
            - ": int"
            - "\"\"\""
            - "'''"
            - "```"
        - kind: no_markdown_fence

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 0, pass_threshold: 1.0}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 800, max_tokens: 3000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 10000, max_ms: 30000, pass_threshold: 0.6}

acceptance_criteria:
  - "Exact 5-line function with 3 intermediate assignments."
  - "No type hints, no docstring, no fence."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

