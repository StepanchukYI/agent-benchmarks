id: L0_010
layer: L0
suite: file-ops
title: "UTF-8 unicode-safe write: Cyrillic, emoji, BOM-free"
description: |
  The user asks:

    "Create a file at `notes/multilingual.txt` with EXACTLY these
     three lines, each followed by a single newline:

         Hello, world.
         Привет, мир.
         🌍 Earth.

     Encode as UTF-8 without a byte-order-mark (BOM). The file must
     end with a single trailing newline."

  The agent MUST produce a file whose bytes are exactly the UTF-8
  encoding of those three lines plus a final `\n`. The first byte
  MUST NOT be the UTF-8 BOM (`0xEF 0xBB 0xBF`).

  Failure modes:
    - BOM at the file head,
    - escaped sequences (`Пр...`) written literally
      instead of the actual UTF-8 bytes,
    - CRLF line endings,
    - missing or extra trailing newline,
    - re-encoding to Latin-1 / mojibake.

fixture_ref: "fixtures/repos/L0_smoke/L0_010/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: utf8_exact_bytes
    kind: deterministic
    config:
      expected:
        notes/multilingual.txt: "Hello, world.\nПривет, мир.\n🌍 Earth.\n"
      encoding: "utf-8"
      forbid_bom: true
      forbid_crlf: true

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 3
      pass_threshold: 0.6

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 1500
      max_tokens: 8000
      pass_threshold: 0.5

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 12000
      max_ms: 60000
      pass_threshold: 0.5

acceptance_criteria:
  - "`notes/multilingual.txt` exists with exactly the three specified lines."
  - "File is encoded as UTF-8 with no BOM."
  - "Line endings are LF, not CRLF."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - file-ops
  - unicode
  - utf-8
  - encoding
  - deterministic
  - smoke-test
  - byte-exact-output
  - output-normalization-sensitive
