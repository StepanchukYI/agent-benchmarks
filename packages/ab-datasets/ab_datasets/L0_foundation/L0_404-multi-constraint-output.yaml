id: L0_404
layer: L0
suite: instruction-following
title: "Multi-constraint output (FollowBench-style: 3 constraints stacked)"
description: |
  The user prompt:

    "Write a short description of the planet Mars under ALL of
     the following constraints simultaneously:
       1. Exactly 20 whitespace-separated tokens (after collapse
          of runs of whitespace to a single space).
       2. No proper nouns OTHER than `Mars` may appear (so no
          `Earth`, `Curiosity`, `Olympus Mons`, etc.).
       3. Contains no comma character (`,`).

     Plain prose only — no markdown, no headers, no list."

  The agent's final message MUST satisfy ALL three constraints
  simultaneously. The scorer checks each constraint individually.

  Failure modes (any one fails the task):
    - off-by-one word count,
    - any banned proper noun appears,
    - any comma in the output,
    - markdown / list formatting.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: multi_constraint_check
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_word_count
          expected: 20
          tokenizer: "whitespace"
          collapse_whitespace: true
        - kind: final_assistant_message_does_not_match
          patterns:
            - ","
            - "\\bEarth\\b"
            - "\\bCuriosity\\b"
            - "\\bOlympus\\b"
            - "\\bMons\\b"
            - "\\bPerseverance\\b"
            - "\\bElon\\b"
            - "\\bMusk\\b"
            - "\\bSpaceX\\b"
            - "\\bNASA\\b"
        - kind: final_assistant_message_contains_substring
          substring: "Mars"
        - kind: final_assistant_message_no_markdown

      pass_threshold: 0.75
  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 0, pass_threshold: 1.0}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 600, max_tokens: 2000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 12000, max_ms: 30000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message has exactly 20 whitespace tokens."
  - "Contains the substring `Mars`."
  - "Contains no banned proper noun and no comma."
  - "No markdown / list formatting."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - instruction-following
  - ifeval
  - followbench
  - multi-constraint
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - tokenizer-sensitive
