id: L0_302
layer: L0
suite: tool-use
title: "Optional-arg gating: decide field inclusion from prior step's policy"
description: |
  You have access to a bash shell. The fixture seeds `seed/policy.json`
  containing the active policy for the current ticket:

      {
        "requires_priority": true,
        "default_priority": "high"
      }

  The user prompt:

    "Acknowledge an incoming ticket. Write your decision to
     `out/decision.json` as a single-line JSON object. The schema is:

         {
           \"action\": \"ack\",
           \"priority\": <string, OPTIONAL>
         }

     RULE: include the `priority` field in the output IF AND ONLY IF
     the seeded policy has `requires_priority == true`. If included,
     its value MUST be the policy's `default_priority`. If the policy
     says `requires_priority == false`, omit the `priority` key
     entirely (do not write `null`, do not write `\"\"`).

     The output must be a single-line minified JSON with keys in the
     order shown above (`action` first, then `priority` if present),
     no trailing newline."

  For this fixture (`requires_priority: true`):
    expected out/decision.json = {"action":"ack","priority":"high"}

  Failure modes:
    - including `priority: null` (didn't omit the optional),
    - hard-coding `priority: "normal"` (didn't read the policy),
    - omitting `priority` (failed to honour the gating rule),
    - reversing key order to `priority` first.

fixture_ref: "fixtures/repos/L0_smoke/L0_302/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: optional_arg_gating
    kind: deterministic
    config:
      assertions:
        - kind: workdir_file_content_equals
          path: "out/decision.json"
          content: "{\"action\":\"ack\",\"priority\":\"high\"}"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 5, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 1500, max_tokens: 5000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "out/decision.json equals byte-exact `{\"action\":\"ack\",\"priority\":\"high\"}`."
  - "Priority field included only because policy required it."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.75
  tool_skill: 0.15
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - tool-use
  - optional-arg
  - conditional
  - state-derived
  - hard
  - byte-exact-output
  - output-normalization-sensitive
