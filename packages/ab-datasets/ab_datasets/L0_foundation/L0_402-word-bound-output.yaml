id: L0_402
layer: L0
suite: instruction-following
title: "Three-axis constraint: word + sentence + forbidden substrings"
description: |
  The user prompt:

    "Describe what makes a violin produce sound. ALL three constraints
     hold simultaneously:

       1. Exactly 28 words (Unicode-word, \\w+) — not 27, not 29.
       2. Exactly 3 sentences (separated by . ! ?).
       3. Must NOT contain (case-insensitive): the strings 'string',
          'wood', 'bow', 'horsehair', 'rosin', 'vibrate', 'vibration'.

     Plain prose only — no markdown, no quotes, no lists, no
     parenthetical asides."

  This is the L0_402 slot reworked as a 3-axis simultaneous constraint
  (word count + sentence count + forbidden vocabulary). The forbidden
  list contains the seven most natural words to use, forcing the model
  to find alternative phrasings ('catgut filament', 'sounding box',
  'oscillate', etc.) while preserving on-topic accuracy.

  Failure modes:
    - any forbidden substring (case-insensitive) → fail,
    - 27 or 29 words → fail,
    - 2 or 4 sentences → fail,
    - markdown / quote leak → fail.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: three_axis_constraint
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_word_count
          expected: 28
        - kind: final_assistant_message_sentence_count_range
          min: 3
          max: 3
        - kind: final_assistant_message_does_not_contain_ci
          forbidden:
            - "string"
            - "wood"
            - "bow"
            - "horsehair"
            - "rosin"
            - "vibrate"
            - "vibration"
        - kind: final_assistant_message_no_markdown
        - kind: final_assistant_message_no_quotes

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 0
      pass_threshold: 1.0

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 400
      max_tokens: 1500
      pass_threshold: 0.6

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 10000
      max_ms: 30000
      pass_threshold: 0.6

acceptance_criteria:
  - "Word count exactly 28."
  - "Sentence count exactly 3."
  - "No forbidden substrings (case-insensitive)."
  - "No markdown, no quotes."
  - "Zero tool calls."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - instruction-following
  - ifbench
  - multi-constraint
  - negative-constraint
  - deterministic
  - hard
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - tokenizer-sensitive
