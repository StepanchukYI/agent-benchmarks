id: L0_510
layer: L0
suite: faithfulness
title: "5-fact staleness classification chain (2021 source vs 2026 today) + sha1"
description: |
  The source below is a hypothetical 2021-dated company profile. It is
  now 2026. Classify each of the 5 claims as `1` (STALE — almost
  certainly no longer accurate by 2026 due to natural drift of the
  type of fact) or `0` (STILL TRUE — a structural/historical fact
  unlikely to change in 5 years).

  ─── SOURCE (dated 2021-06-15) ───
  Atlas Robotics is a privately held robotics company headquartered
  in Stockholm, Sweden. Founded by Tessa Quinn in 2009, the firm has
  developed industrial sorting arms used in Nordic logistics. The
  CEO since founding is Tessa Quinn. As of 2021, the company has 412
  employees and raised $87M across three rounds. Atlas's flagship
  product, the Q-Sorter v2, is used at 23 distribution centres in
  Sweden, Norway, and Denmark. The company holds 14 patents in
  end-effector design.
  ─── END SOURCE ───

  Claims to classify (1 = STALE in 2026, 0 = STILL TRUE in 2026):
    C1: "Atlas Robotics has 412 employees."
        (Headcount drifts — 5-year-old figure almost never current. STALE → 1)
    C2: "Atlas Robotics was founded in 2009."
        (Historical fact, doesn't change. STILL TRUE → 0)
    C3: "Tessa Quinn is CEO of Atlas Robotics."
        (Leadership can change; 5-year-old "since founding" still
         carries no guarantee. STALE → 1, the document cannot
         certify current CEO in 2026.)
    C4: "Atlas Robotics is headquartered in Stockholm."
        (HQ rarely moves; treated as STILL TRUE → 0.)
    C5: "Atlas Robotics holds 14 patents in end-effector design."
        (Patent count grows over 5 years almost certainly. STALE → 1.)

  Chain = "<c1><c2><c3><c4><c5>" — five binary digits glued.
  For this set the chain is `10101`. Compute lowercase hex SHA-1 of
  the 5-char chain (UTF-8) and emit ONLY the 40-character digest.

  Failure modes:
    - treating headcount/patent counts as STILL TRUE (they almost
      always drift over 5 years),
    - treating "founded year" or "HQ city" as STALE (these are
      historical/structural),
    - over-confidence on CEO (the model should mark STALE since
      the source cannot certify the 2026 CEO),
    - emitting the chain instead of the sha1.

fixture_ref:

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: {skills: [], mcps: [], vault_state: {}}

scorer_chain:
  - name: stale_chain_sha1
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "5f9a4125cace29c1a4db8fee4eb3657c949d176c"
          trim_whitespace: true
        - kind: final_assistant_message_does_not_contain
          forbidden:
            - "10101"
            - "Atlas"
            - "stale"
            - "answer"
            - "claim"

  - name: privacy_check
    kind: privacy_check
    config: {patterns_path: "docs/privacy-patterns.yaml"}

  - name: tool_skill
    kind: deterministic
    config: {max_tool_calls: 4, pass_threshold: 0.8}

  - name: context_efficiency
    kind: deterministic
    config: {target_tokens: 2000, max_tokens: 6000, pass_threshold: 0.6}

  - name: latency_cost
    kind: deterministic
    config: {target_ms: 18000, max_ms: 60000, pass_threshold: 0.6}

acceptance_criteria:
  - "Final message is lowercase 40-char sha1 of `10101`."
  - "All 5 staleness classifications correct."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.10
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

