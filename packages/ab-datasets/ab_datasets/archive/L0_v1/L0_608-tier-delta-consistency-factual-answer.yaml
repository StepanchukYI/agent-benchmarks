id: L0_608
layer: L0
suite: environment-probe
title: "Tier-delta consistency: same factual answer at T0 and T2 (style may vary, fact must not)"
description: |
  Probe whether changing tier affects FACTUAL output (which it should
  not). The probe is a single factual question with one objectively
  correct answer:

    "What is the chemical symbol for gold? Output ONLY the symbol —
     one or two letters, no prose, no punctuation."

  The correct answer is `Au` at every tier. This task is intended to
  be run cross-tier (`also_run_on: [T1, T2, T3]`) and the harness's
  tier-delta diff should show ZERO factual divergence: every run
  produces the exact same one-word answer. Style/wrapping may vary
  (and the prompt asks for none), but the answer character sequence
  MUST be `Au` regardless of operator config.

  This is the canary for "did operator config silently break a
  factual capability?" — if T2 differs from T0 here, something in
  the operator file is poisoning the agent's chemistry knowledge.

fixture_ref: null

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T1
    - T2
    - T3
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: factual_constant_check
    kind: deterministic
    config:
      assertions:
        - kind: final_assistant_message_equals
          expected: "Au"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config:
      max_tool_calls: 0
      pass_threshold: 1.0

  - name: context_efficiency
    kind: deterministic
    config:
      target_tokens: 500
      max_tokens: 3000
      pass_threshold: 0.5

  - name: latency_cost
    kind: deterministic
    config:
      target_ms: 8000
      max_ms: 45000
      pass_threshold: 0.5

acceptance_criteria:
  - "Final assistant message equals `Au` exactly (no quotes, no prose, no trailing newline)."
  - "Zero tool calls."
  - "Privacy scan produces zero hits."
  - "Across all tiers in also_run_on, the answer character sequence is identical."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: easy
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - environment-probe
  - tier-delta
  - canary
  - factual
  - cross-tier
  - deterministic
  - byte-exact-output
  - output-normalization-sensitive
  - factual-recall
