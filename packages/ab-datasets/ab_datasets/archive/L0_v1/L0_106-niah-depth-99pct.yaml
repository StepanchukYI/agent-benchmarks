id: L0_106
layer: L0
suite: long-context-niah
title: "Needle at ~99% depth (very end of haystack) — RULER-style"
description: |
  The fixture contains one planted fact near the END of the
  document (~99% depth):

      "The Brumcastle treaty of 1856 was signed by exactly four
       delegates: Idris, Mira, Sevda, and Volker."

  The user asks:

    "From the haystack: list the four signatories of the
     Brumcastle treaty of 1856, in the EXACT order they appear in
     the text, comma-separated, no spaces around commas. Output
     ONLY the list, no prose."

  The agent's final message MUST equal `Idris,Mira,Sevda,Volker`
  exactly.

  Late-depth probes expose recency-biased attention failures.

fixture_ref: "fixtures/repos/L0_smoke/L0_106/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: exact_signers_check
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "Idris,Mira,Sevda,Volker"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 1, pass_threshold: 1.0 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 12000, max_tokens: 40000, pass_threshold: 0.3 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 30000, max_ms: 180000, pass_threshold: 0.3 }

acceptance_criteria:
  - "Final assistant message equals `Idris,Mira,Sevda,Volker` exactly."
  - "Order matches the source text."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - ruler
  - depth-curve
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
