id: L0_507
layer: L0
suite: faithfulness
title: "Inferred consistency: four facts, are they mutually consistent?"
description: |
  The fixture `source.txt` presents four labelled facts:

      [F1] Roen is the only child of Lyra.
      [F2] Idris is older than Lyra.
      [F3] Sevda is Roen's grandparent on the maternal side.
      [F4] Sevda is younger than Idris.

  Step through the implications:
    - F1 + F3 imply Sevda is Lyra's mother.
    - Therefore Sevda > Lyra in age.
    - F2: Idris > Lyra.
    - F4: Sevda < Idris.
    - Combined order: Idris > Sevda > Lyra > Roen. No contradiction.

  Therefore the four facts ARE consistent. The correct answer is
  `consistent`.

  The user asks:

    "Are the four facts in source.txt mutually consistent? Output
     ONLY one lowercase word: `consistent` or `inconsistent`. No
     prose."

  Failure modes:
    - jumping to `inconsistent` after a shallow read,
    - returning `unknown` (no abstention permitted — full
      determination required from the facts),
    - returning with punctuation / capitals.

fixture_ref: "fixtures/repos/L0_smoke/L0_507/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: consistency_verdict
    kind: deterministic
    config:
      source_file: "source.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "consistent"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 2, pass_threshold: 0.8 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 1500, max_tokens: 8000, pass_threshold: 0.5 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 15000, max_ms: 90000, pass_threshold: 0.5 }

acceptance_criteria:
  - "Final assistant message equals `consistent` exactly."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - faithfulness
  - inference
  - logical-consistency
  - truthfulqa
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
