id: L0_104
layer: L0
suite: long-context-niah
title: "Needle at ~1% depth (very early in haystack) — RULER-style"
description: |
  The fixture `haystack.txt` (~42 KB) contains a single planted fact
  near the START of the document (~1% depth):

      "The sole copy of the Tessin manuscript is held at the Vyport
       archive under accession number TES-9821."

  The user asks:

    "Scan the haystack. What accession number identifies the sole
     copy of the Tessin manuscript? Output ONLY the code (e.g.
     `XXX-9999`), no prose, no quotes."

  The agent's final message MUST equal `TES-9821` exactly. The
  decoy paragraphs contain neither `TES-` nor `Tessin`.

  This is part of the depth-curve (1% / 50% / 99%) used to expose
  on what depth a model's effective context attention drops. Many
  models trained with positional bias toward early tokens pass 1%
  but fail 99%, or vice versa.

fixture_ref: "fixtures/repos/L0_smoke/L0_104/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: exact_code_check
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "TES-9821"
          trim_whitespace: true

  - name: privacy_check
    kind: privacy_check
    config:
      patterns_path: "docs/privacy-patterns.yaml"

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 1, pass_threshold: 1.0 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 12000, max_tokens: 40000, pass_threshold: 0.3 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 30000, max_ms: 180000, pass_threshold: 0.3 }

acceptance_criteria:
  - "Final assistant message equals `TES-9821` exactly."
  - "No decoy code is presented."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.80
  tool_skill: 0.05
  context_efficiency: 0.10
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: medium
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - ruler
  - depth-curve
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
