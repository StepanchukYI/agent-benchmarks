id: L0_121
layer: L0
suite: long-context-niah
title: "Seven-needle NIAH with decoy `code is` lines"
description: |
  The fixture provides `haystack.txt` (~22 KB, 50 paragraphs) with
  SEVEN planted "warehouse code" needles, scattered across the
  document:

      "The Felden     warehouse code is W-2210."
      "The Marrowfen  warehouse code is W-5587."
      "The Anvilford  warehouse code is W-9046."
      "The Storra     warehouse code is W-3318."
      "The Vyport     warehouse code is W-6741."
      "The Greylock   warehouse code is W-4099."
      "The Brumcastle warehouse code is W-8253."

  The haystack ALSO contains several decoy "code is" lines that
  match the same pattern but are NOT warehouse codes (stables,
  granary, foundry, mill, kiln). The agent must extract only the
  warehouse codes, ignoring the lookalikes.

  The user asks:

      "From the haystack: list every WAREHOUSE code only (ignore
       stables / granary / foundry / mill / kiln). One pair per
       line as `<place>=<code>`, alphabetical by place. No prose."

  Expected final assistant message (exact, 7 lines):

      Anvilford=W-9046
      Brumcastle=W-8253
      Felden=W-2210
      Greylock=W-4099
      Marrowfen=W-5587
      Storra=W-3318
      Vyport=W-6741

fixture_ref: "fixtures/repos/L0_smoke/L0_121/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on: [T2]
  requires: { skills: [], mcps: [], vault_state: {} }

scorer_chain:
  - name: exact_multi_key_check
    kind: deterministic
    config:
      source_file: "haystack.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "Anvilford=W-9046\nBrumcastle=W-8253\nFelden=W-2210\nGreylock=W-4099\nMarrowfen=W-5587\nStorra=W-3318\nVyport=W-6741"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 3, pass_threshold: 0.7 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 10000, max_tokens: 40000, pass_threshold: 0.3 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 40000, max_ms: 240000, pass_threshold: 0.3 }

acceptance_criteria:
  - "Final assistant message lists exactly seven `<place>=<code>` pairs."
  - "All seven warehouse-code pairs present and correct."
  - "Decoy `<place>=<code>` lines (stables/granary/etc.) are EXCLUDED."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - niah
  - multi-needle
  - decoy
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
