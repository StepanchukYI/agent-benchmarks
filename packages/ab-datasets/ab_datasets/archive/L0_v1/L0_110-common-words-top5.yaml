id: L0_110
layer: L0
suite: long-context-aggregation
title: "Common-words aggregation (top-5 most frequent) — RULER-style"
description: |
  The fixture `wordstream.txt` (~30 KB) is a long shuffled stream of
  whitespace-separated tokens. Most tokens are unique throwaway
  fillers (~3000 distinct `filNNNNN`). Five "salt" words appear
  many times each, deterministically:

      raven      × 120
      amber      × 95
      Saltmoor   × 82
      lantern    × 70
      Idris      × 58

  The user asks:

    "From wordstream.txt, output the 5 most frequent
     whitespace-separated tokens, one per line, in descending
     order of frequency. Tie-break alphabetically. Output ONLY
     the tokens, no counts, no prose."

  Expected final message (5 lines, exact, case-sensitive):

      raven
      amber
      Saltmoor
      lantern
      Idris

  Ground-truth counts are pinned in `ground_truth.txt` next to the
  fixture for scorer audit. Failure modes:
    - returning a filler token (didn't actually count),
    - wrong order (didn't sort by frequency),
    - case drift (`saltmoor` instead of `Saltmoor`),
    - including counts.

fixture_ref: "fixtures/repos/L0_smoke/L0_110/"

config:
  required_tier: T0
  recommended_tier: T0
  also_run_on:
    - T2
  requires:
    skills: []
    mcps: []
    vault_state: {}

scorer_chain:
  - name: exact_top5_check
    kind: deterministic
    config:
      source_file: "wordstream.txt"
      ground_truth_file: "ground_truth.txt"
      assertions:
        - kind: final_assistant_message_equals
          expected: "raven\namber\nSaltmoor\nlantern\nIdris"
          trim_trailing_newline: true

  - name: privacy_check
    kind: privacy_check
    config: { patterns_path: "docs/privacy-patterns.yaml" }

  - name: tool_skill
    kind: deterministic
    config: { max_tool_calls: 2, pass_threshold: 0.8 }

  - name: context_efficiency
    kind: deterministic
    config: { target_tokens: 10000, max_tokens: 32000, pass_threshold: 0.3 }

  - name: latency_cost
    kind: deterministic
    config: { target_ms: 45000, max_ms: 240000, pass_threshold: 0.3 }

acceptance_criteria:
  - "Final assistant message lists exactly five tokens, one per line."
  - "Tokens are in correct descending-frequency order."
  - "Case preserved exactly."
  - "No counts, no prose."
  - "Privacy scan produces zero hits."

weights:
  correctness: 0.85
  tool_skill: 0.05
  context_efficiency: 0.05
  latency_cost: 0.05
  memory_specific: 0.00

difficulty: hard
visibility: public
trust_tier_ceiling: verified

tags:
  - L0
  - long-context
  - aggregation
  - common-words
  - ruler
  - frontier
  - deterministic
  - reasoning-sensitive
  - byte-exact-output
  - output-normalization-sensitive
  - context-window-sensitive
