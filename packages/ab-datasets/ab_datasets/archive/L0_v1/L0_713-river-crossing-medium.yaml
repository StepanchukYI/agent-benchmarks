id: L0_713
layer: L0
suite: reasoning-trap
title: "Constraint-satisfaction: minimum trips for a small river-crossing (medium)"
description: |
  Three people (P, Q, R) must cross a river using a single boat that
  holds AT MOST two people at a time. The boat cannot cross empty —
  someone must row it back. R is the only one strong enough to row;
  P and Q cannot row at all. All three must end up on the far bank.

  What is the MINIMUM number of one-way boat trips (each crossing
  counts as one trip, whether outbound or return) needed to get all
  three to the far bank?

  Walkthrough:
    Trip 1: R takes P across.         Far: {P, R} · Near: {Q}
    Trip 2: R returns alone.          Far: {P}    · Near: {Q, R}
    Trip 3: R takes Q across.         Far: {P, Q, R}

  Three trips suffice. Output ONLY the single digit `3` — no prose,
  no trailing newline.

fixture_ref: null

