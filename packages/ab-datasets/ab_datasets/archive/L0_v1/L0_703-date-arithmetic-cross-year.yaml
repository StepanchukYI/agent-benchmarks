id: L0_703
layer: L0
suite: reasoning-trap
title: "Date arithmetic across year boundary (BBH-style)"
description: |
  Given a fixed reference date, subtract a number of days that
  crosses the year boundary. The fixture is text-only — date is in
  the prompt.

  The user prompt:

    "If today is 14 February 2027, what was the date exactly 47
     days ago? Output ONLY the date in ISO 8601 format
     (YYYY-MM-DD), no prose, no quotes."

  Compute step-by-step:
    - 14 days back from Feb 14 → Jan 31, 2027 (14 days subtracted)
    - 31 more days back → Dec 31, 2026 (45 days subtracted)
    - 2 more days → Dec 29, 2026 (47 days subtracted)

  Answer: `2026-12-29`.

  Failure modes:
    - off-by-one (`2026-12-28` or `2026-12-30`),
    - forgetting year decrement,
    - leap-year confusion (2024 is leap; 2027 is not, but
      computation involves 2026 → 2027 transition).

fixture_ref: null

