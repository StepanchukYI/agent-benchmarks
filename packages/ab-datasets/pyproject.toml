[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-datasets"
version = "0.0.1"
description = "Task catalog, fixtures, and Pydantic schemas for agent-benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-benchmarks contributors" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["ab_datasets"]
