[project]
name = "agent-benchmarks-workspace"
version = "0.0.0"
description = "agent-benchmarks workspace root (not published)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/ab-datasets",
    "packages/ab-harness",
    "packages/ab-server",
    "packages/ab-sdk",
    "packages/ab-cli",
]

[tool.uv.sources]
ab-datasets = { workspace = true }
ab-harness  = { workspace = true }
ab-server   = { workspace = true }
ab-sdk      = { workspace = true }
ab-cli      = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "ab-datasets",
    "ab-harness",
    "ab-server",
    "ab-sdk",
    "ab-cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"packages/ab-cli/ab_cli/commands/**" = ["B008"]
"packages/ab-server/ab_server/api/**" = ["B008"]
"packages/ab-server/ab_server/leaderboard/**" = ["RUF002", "RUF003"]
"packages/ab-server/tests/**" = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests-e2e"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "isolation: Tier A deterministic isolation verification (no live model, mock Popen)",
    "live_isolation: Tier B gated live-sentinel isolation harness (costs tokens, opt-in via AB_RUN_LIVE_ISOLATION=1)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["packages/ab-datasets/ab_datasets", "packages/ab-harness/ab_harness", "packages/ab-server/ab_server", "packages/ab-sdk/ab_sdk", "packages/ab-cli/ab_cli"]
