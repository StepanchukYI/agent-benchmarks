# nginx config for the ab-leaderboard SPA.
# Serves the Vite build with proper cache headers and SPA fallback.
#
# NOTE on add_header inheritance:
#   nginx does NOT merge add_header across nested location blocks. If a
#   location declares ANY add_header, it loses all parent headers. We work
#   around this by defining the security header set once as a variable map
#   and re-asserting it via a single `include` snippet in every location
#   that needs its own headers.

# Shared snippet: security headers. Sourced via `include` in every location.
# Lives in the same conf dir as default.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Server-level security headers. These apply to responses that don't have
    # their own add_header (e.g. nginx 404 pages). Location blocks re-assert
    # the same headers, since add_header doesn't inherit when a child sets any.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression. gzip is universally available; the upstream Caddy adds zstd.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Vite emits content-hashed bundles into /assets — safe to cache forever.
    location /assets/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static files (favicon, robots, etc) — short cache.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|eot)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Never cache index.html — must reflect latest deployment.
    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Liveness probe — plain text, no headers needed.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: anything that doesn't match a file goes to index.html
    # so react-router can take over. Headers inherit from server-level
    # because this block defines none.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
